<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Autokorjaamo Putkonen Ky Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
  :root {
    --hue: 200;
    --bg: hsl(var(--hue) 25% 96%);
    --panel: #ffffff;
    --ink: hsl(var(--hue) 30% 12%);
    --muted: hsl(var(--hue) 12% 42%);
    --line: hsl(var(--hue) 18% 88%);
    --accent: hsl(var(--hue) 62% 38%);
    --accent-ink: #ffffff;
    --bot: hsl(var(--hue) 30% 94%);
    --flag-bg: #fff4d6;
    --flag-ink: #6b4a00;
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: hsl(var(--hue) 22% 9%);
      --panel: hsl(var(--hue) 20% 13%);
      --ink: hsl(var(--hue) 20% 92%);
      --muted: hsl(var(--hue) 10% 66%);
      --line: hsl(var(--hue) 15% 24%);
      --accent: hsl(var(--hue) 60% 62%);
      --accent-ink: hsl(var(--hue) 40% 10%);
      --bot: hsl(var(--hue) 18% 19%);
      --flag-bg: #3a2f10;
      --flag-ink: #ffd98a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: hsl(var(--hue) 22% 9%);
    --panel: hsl(var(--hue) 20% 13%);
    --ink: hsl(var(--hue) 20% 92%);
    --muted: hsl(var(--hue) 10% 66%);
    --line: hsl(var(--hue) 15% 24%);
    --accent: hsl(var(--hue) 60% 62%);
    --accent-ink: hsl(var(--hue) 40% 10%);
    --bot: hsl(var(--hue) 18% 19%);
    --flag-bg: #3a2f10;
    --flag-ink: #ffd98a;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: inherit; font-size: 15px; line-height: 1.5;
    padding-inline: 16px; padding-block: 16px; box-sizing: border-box;
    display: flex; justify-content: center;
  }
  .app {
    width: 100%; max-width: 440px; height: 100%; max-height: 760px;
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  }
  .flag {
    background: var(--flag-bg); color: var(--flag-ink);
    font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    padding: 8px 14px; text-align: center;
  }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; flex: none;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-weight: 700;
  }
  header h1 { font-size: 16px; margin: 0; text-wrap: balance; }
  header a { font-size: 13px; color: var(--muted); text-decoration: none; }
  header a:hover { text-decoration: underline; }
  .log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .me { background: var(--accent); color: var(--accent-ink); align-self: flex-end; border-bottom-right-radius: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; }
  .chips button {
    font: inherit; font-size: 13px; cursor: pointer;
    background: transparent; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 999px; padding: 5px 11px;
  }
  .chips button:hover { background: var(--bot); }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  input {
    flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
  }
  form button {
    font: inherit; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 0 16px;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note { font-size: 12px; color: var(--muted); text-align: center; padding: 0 16px 12px; margin: 0; }
</style>

<div class="app">
  <div class="flag">EXAMPLE · demo chatbot, not official</div>
  <header>
    <div class="avatar" id="avatar"></div>
    <div>
      <h1 id="name"></h1>
      <a id="site" target="_blank" rel="noopener"></a>
    </div>
  </header>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form id="form">
    <input id="q" autocomplete="off" placeholder="Type a question…" aria-label="Your question">
    <button type="submit">Send</button>
  </form>
  <p class="note">Keyword-based example built from public info on the company's website.</p>
</div>

<script>
const DEMO = {"name":"Autokorjaamo Putkonen Ky","site":"https://www.autokorjaamoputkonen.fi/","hue":12,"intro":"Hi! I'm the example assistant for Autokorjaamo Putkonen Ky, a family car repair shop in Lahti since 1989. Ask me about our services, opening hours or location.","chips":["What are your opening hours?","Where are you located?","What services do you offer?","Do you service newer cars under warranty?","What vehicles do you work on?","How can I contact you?"],"kb":[[[" warranty"," newer"," new car"," manufacturer"," service programme"," service schedule"],"Yes. Small independent workshops like ours can also do the scheduled maintenance of newer cars. We always service according to the manufacturer's instructions. Remember: your car's warranty stays valid only when the car has been maintained according to its service programme."],[[" hours"," open"," opening"," when"," weekend"," saturday"," sunday"," evening"],"We're open Monday to Friday, 7:00-17:00. Other times are possible by arrangement."],[[" where"," address"," located"," location"," find you"," directions"," lahti"],"You'll find us at Mestarinkatu 17, 15800 Lahti."],[[" contact"," phone"," call"," email"," reach"," number"," book"," booking"," appointment"],"Call us on 03 752 0833, or Kai Putkonen on 040 582 3799. Email: putkonenky@gmail.com. We're open Mon-Fri 7:00-17:00."],[[" vehicle"," van "," vans"," motorhome"," camper"," machine"," engine"," work on"],"We work on passenger cars, vans, low motorhomes and similar vehicles. We also service other machines with combustion engines."],[[" maintenance"," oil"," filter"," brake"," timing belt"," cambelt"," coolant"," tread"," steering"],"Our maintenance includes oil and filter changes, checking coolant freeze protection and brake fluid water content, checking tyre tread and steering joints, and replacing brake pads, brake discs and timing belts. We always follow the manufacturer's instructions."],[[" tyre"," tire"," wheel"],"Yes, we offer tyre services."],[[" inspection"," katsastus"],"Yes, we offer inspection services (katsastuspalvelut)."],[[" damage"," collision"," accident"," crash"," dent"," body "],"Yes, we are also a damage repair workshop (vauriokorjaamo)."],[[" plough"," plow"," snow"],"Yes, we do plough angle adjustments."],[[" install"],"Yes, we offer installation services."],[[" price"," cost"," how much"," quote"," expensive"," cheap"],"Prices aren't listed on our website. We always discuss labour and parts prices openly with you. For a price, call 03 752 0833."],[[" unexpected"," surprise"],"We always let you know if something unexpected comes up during a repair or service."],[[" since"," history"," about"," family"," how long"," owner"," who "],"Autokorjaamo Putkonen Ky has served Lahti drivers since 1989. We're a private family business, which means flexibility, cost-efficiency and fair dealing. The owner is Kai Putkonen."],[[" service"," offer"," repair"," fix"," do you do"],"We offer maintenance services, car repairs, installation, inspection services, tyre services, damage repair and plough angle adjustments. We work on passenger cars, vans, low motorhomes and more."]],"contact":"putkonenky@gmail.com or 03 752 0833"};

document.documentElement.style.setProperty("--hue", DEMO.hue ?? 200);
document.getElementById("name").textContent = DEMO.name;
document.getElementById("avatar").textContent = (DEMO.name || "?").trim().charAt(0).toUpperCase();
const siteLink = document.getElementById("site");
siteLink.href = DEMO.site;
siteLink.textContent = DEMO.site.replace(/^https?:\/\//, "").replace(/\/$/, "");

const log = document.getElementById("log");
function say(text, who) {
  const el = document.createElement("div");
  el.className = "msg " + who;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

function answer(question) {
  const text = " " + question.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ") + " ";
  for (const [keys, reply] of DEMO.kb) {
    if (keys.some(k => text.includes(k.toLowerCase()))) return reply;
  }
  return "I don't have that answer in this example. You can contact the team directly: " + DEMO.contact;
}

function ask(question) {
  question = question.trim();
  if (!question) return;
  say(question, "me");
  setTimeout(() => say(answer(question), "bot"), 350);
}

const chips = document.getElementById("chips");
for (const c of DEMO.chips) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = c;
  b.addEventListener("click", () => ask(c));
  chips.appendChild(b);
}

document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const q = document.getElementById("q");
  ask(q.value);
  q.value = "";
});

say(DEMO.intro, "bot");
</script>

</body>
</html>
