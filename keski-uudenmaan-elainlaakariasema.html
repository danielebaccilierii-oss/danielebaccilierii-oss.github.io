<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>Keski-Uudenmaan Eläinlääkäriasema Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
  :root {
    --hue: 200;
    --bg: hsl(var(--hue) 25% 96%);
    --panel: #ffffff;
    --ink: hsl(var(--hue) 30% 12%);
    --muted: hsl(var(--hue) 12% 42%);
    --line: hsl(var(--hue) 18% 88%);
    --accent: hsl(var(--hue) 62% 38%);
    --accent-ink: #ffffff;
    --bot: hsl(var(--hue) 30% 94%);
    --flag-bg: #fff4d6;
    --flag-ink: #6b4a00;
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: hsl(var(--hue) 22% 9%);
      --panel: hsl(var(--hue) 20% 13%);
      --ink: hsl(var(--hue) 20% 92%);
      --muted: hsl(var(--hue) 10% 66%);
      --line: hsl(var(--hue) 15% 24%);
      --accent: hsl(var(--hue) 60% 62%);
      --accent-ink: hsl(var(--hue) 40% 10%);
      --bot: hsl(var(--hue) 18% 19%);
      --flag-bg: #3a2f10;
      --flag-ink: #ffd98a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: hsl(var(--hue) 22% 9%);
    --panel: hsl(var(--hue) 20% 13%);
    --ink: hsl(var(--hue) 20% 92%);
    --muted: hsl(var(--hue) 10% 66%);
    --line: hsl(var(--hue) 15% 24%);
    --accent: hsl(var(--hue) 60% 62%);
    --accent-ink: hsl(var(--hue) 40% 10%);
    --bot: hsl(var(--hue) 18% 19%);
    --flag-bg: #3a2f10;
    --flag-ink: #ffd98a;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: inherit; font-size: 15px; line-height: 1.5;
    padding-inline: 16px; padding-block: 16px; box-sizing: border-box;
    display: flex; justify-content: center;
  }
  .app {
    width: 100%; max-width: 440px; height: 100%; max-height: 760px;
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  }
  .flag {
    background: var(--flag-bg); color: var(--flag-ink);
    font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    padding: 8px 14px; text-align: center;
  }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; flex: none;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-weight: 700;
  }
  header h1 { font-size: 16px; margin: 0; text-wrap: balance; }
  header a { font-size: 13px; color: var(--muted); text-decoration: none; }
  header a:hover { text-decoration: underline; }
  .log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .me { background: var(--accent); color: var(--accent-ink); align-self: flex-end; border-bottom-right-radius: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; }
  .chips button {
    font: inherit; font-size: 13px; cursor: pointer;
    background: transparent; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 999px; padding: 5px 11px;
  }
  .chips button:hover { background: var(--bot); }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  input {
    flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
  }
  form button {
    font: inherit; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 0 16px;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note { font-size: 12px; color: var(--muted); text-align: center; padding: 0 16px 12px; margin: 0; }
</style>

</head>
<body>
<div class="app">
  <div class="flag">EXAMPLE · demo chatbot, not official</div>
  <header>
    <div class="avatar" id="avatar"></div>
    <div>
      <h1 id="name"></h1>
      <a id="site" target="_blank" rel="noopener"></a>
    </div>
  </header>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form id="form">
    <input id="q" autocomplete="off" placeholder="Type a question…" aria-label="Your question">
    <button type="submit">Send</button>
  </form>
  <p class="note">Keyword-based example built from public info on the company's website.</p>
</div>

<script>
const DEMO = {"name":"Keski-Uudenmaan Eläinlääkäriasema","site":"https://www.keravanelainlaakari.fi","hue":165,"intro":"Hi! I'm the example assistant of Keski-Uudenmaan Eläinlääkäriasema, an independent small animal clinic in Kerava for over 30 years. Ask me about opening hours, services, prices or our team. I can't give medical advice: for your pet's health, please call the clinic.","chips":["What are your opening hours?","Where are you located?","How much is a vaccination?","What services do you offer?","Do you do dental care?","Who are your vets?"],"kb":[[[" sick"," ill"," symptom"," emergenc"," urgent"," hurt"," injur"," pain"," vomit"," diarrh"," medic"," dose"," advice"],"I can't give medical advice in this chat. Please call the clinic at (09) 2747 640 (Mon-Fri 9-20) and the staff will help you."],[[" hour"," open"," close"," when"," time"," weekend"," saturday"," sunday"],"We are open Monday to Friday, 9:00-20:00."],[[" where"," address"," locat"," find you"," kerava"," direction"],"You can find us at Lintulammenkatu 6, 04250 Kerava."],[[" vaccin"," rabies"," shot"],"Vaccination prices: dog vaccination (combination vaccine + rabies) 76 €, cat vaccination (triple vaccine) 67 €. To book, call (09) 2747 640."],[[" neuter"," castrat"," spay"," steril"],"Neutering prices: male cat castration 110 €, female cat sterilisation 158 €, male dog castration from 310 €, female dog sterilisation from 445 €."],[[" dental"," teeth"," tooth"," tartar"," dentist"],"We do dental tartar removal and have a dental unit with drill, which allows surgical tooth extractions. We also remove baby teeth. Tartar removal: cat from 135 €, dog from 215 €."],[[" euthanas"," put down"," put to sleep"],"Euthanasia: cat from 112 €, dog from 150 €. Costs from Suomen Eläintuhkaus Oy may be added if needed. Please call us at (09) 2747 640."],[[" x ray"," xray"," röntgen"," radiograph"," pregnan"],"We have X-ray, used to help diagnose illnesses; official X-ray screenings and pregnancy X-rays are also possible. Ultrasound examinations help diagnose internal organ diseases and confirm pregnancy."],[[" ultrasound"," ultra sound"],"Ultrasound examinations help diagnose internal organ diseases and can also confirm pregnancy."],[[" lab"," blood"," sample"," test"],"We can examine many types of samples in our own laboratory, and send samples to partner laboratories when needed."],[[" surgery"," operat"," anesth"," anaesth"],"We have an operating room with inhalation anaesthesia equipment."],[[" acupunct"," laser"],"We offer acupuncture and laser therapy for your pet."],[[" price"," cost"," how much"," fee"," visit"," appointment"," consult"],"A basic visit (15 min) costs 65 €. You can also ask me about vaccination, neutering or dental prices. To book, call (09) 2747 640."],[[" service"," offer"," do you do"," treat"],"Our services: X-ray, ultrasound, laboratory, operating room with inhalation anaesthesia, dental care, acupuncture and laser therapy."],[[" vet"," doctor"," staff"," team"," nurse"," who"],"Our veterinarians are Johanna Parkkisenniemi and Senna Kallio. Our veterinary nurses are Pauliina Harjuvaara and Emmi Norha."],[[" animal"," pet"," dog"," cat"," chain"," about"],"We are a private small animal clinic, not part of any chain, operating in Kerava for over thirty years."],[[" contact"," phone"," call"," email"," book"," reserv"],"Phone: (09) 2747 640. Email: kuela@kuela.inet.fi. Address: Lintulammenkatu 6, 04250 Kerava."]],"contact":"phone (09) 2747 640 or email kuela@kuela.inet.fi"};

document.documentElement.style.setProperty("--hue", DEMO.hue ?? 200);
document.getElementById("name").textContent = DEMO.name;
document.getElementById("avatar").textContent = (DEMO.name || "?").trim().charAt(0).toUpperCase();
const siteLink = document.getElementById("site");
siteLink.href = DEMO.site;
siteLink.textContent = DEMO.site.replace(/^https?:\/\//, "").replace(/\/$/, "");

const log = document.getElementById("log");
function say(text, who) {
  const el = document.createElement("div");
  el.className = "msg " + who;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

function answer(question) {
  const text = " " + question.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ") + " ";
  for (const [keys, reply] of DEMO.kb) {
    if (keys.some(k => text.includes(k.toLowerCase()))) return reply;
  }
  return "I don't have that answer in this example. You can contact the team directly: " + DEMO.contact;
}

function ask(question) {
  question = question.trim();
  if (!question) return;
  say(question, "me");
  setTimeout(() => say(answer(question), "bot"), 350);
}

const chips = document.getElementById("chips");
for (const c of DEMO.chips) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = c;
  b.addEventListener("click", () => ask(c));
  chips.appendChild(b);
}

document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const q = document.getElementById("q");
  ask(q.value);
  q.value = "";
});

say(DEMO.intro, "bot");
</script>
</body>
</html>
