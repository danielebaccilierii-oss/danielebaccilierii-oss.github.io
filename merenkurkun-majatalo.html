<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>Merenkurkun Majatalo Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
  :root {
    --hue: 200;
    --bg: hsl(var(--hue) 25% 96%);
    --panel: #ffffff;
    --ink: hsl(var(--hue) 30% 12%);
    --muted: hsl(var(--hue) 12% 42%);
    --line: hsl(var(--hue) 18% 88%);
    --accent: hsl(var(--hue) 62% 38%);
    --accent-ink: #ffffff;
    --bot: hsl(var(--hue) 30% 94%);
    --flag-bg: #fff4d6;
    --flag-ink: #6b4a00;
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: hsl(var(--hue) 22% 9%);
      --panel: hsl(var(--hue) 20% 13%);
      --ink: hsl(var(--hue) 20% 92%);
      --muted: hsl(var(--hue) 10% 66%);
      --line: hsl(var(--hue) 15% 24%);
      --accent: hsl(var(--hue) 60% 62%);
      --accent-ink: hsl(var(--hue) 40% 10%);
      --bot: hsl(var(--hue) 18% 19%);
      --flag-bg: #3a2f10;
      --flag-ink: #ffd98a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: hsl(var(--hue) 22% 9%);
    --panel: hsl(var(--hue) 20% 13%);
    --ink: hsl(var(--hue) 20% 92%);
    --muted: hsl(var(--hue) 10% 66%);
    --line: hsl(var(--hue) 15% 24%);
    --accent: hsl(var(--hue) 60% 62%);
    --accent-ink: hsl(var(--hue) 40% 10%);
    --bot: hsl(var(--hue) 18% 19%);
    --flag-bg: #3a2f10;
    --flag-ink: #ffd98a;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: inherit; font-size: 15px; line-height: 1.5;
    padding-inline: 16px; padding-block: 16px; box-sizing: border-box;
    display: flex; justify-content: center;
  }
  .app {
    width: 100%; max-width: 440px; height: 100%; max-height: 760px;
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  }
  .flag {
    background: var(--flag-bg); color: var(--flag-ink);
    font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    padding: 8px 14px; text-align: center;
  }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; flex: none;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-weight: 700;
  }
  header h1 { font-size: 16px; margin: 0; text-wrap: balance; }
  header a { font-size: 13px; color: var(--muted); text-decoration: none; }
  header a:hover { text-decoration: underline; }
  .log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .me { background: var(--accent); color: var(--accent-ink); align-self: flex-end; border-bottom-right-radius: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; }
  .chips button {
    font: inherit; font-size: 13px; cursor: pointer;
    background: transparent; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 999px; padding: 5px 11px;
  }
  .chips button:hover { background: var(--bot); }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  input {
    flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
  }
  form button {
    font: inherit; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 0 16px;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note { font-size: 12px; color: var(--muted); text-align: center; padding: 0 16px 12px; margin: 0; }
</style>

</head>
<body>
<div class="app">
  <div class="flag">EXAMPLE · demo chatbot, not official</div>
  <header>
    <div class="avatar" id="avatar"></div>
    <div>
      <h1 id="name"></h1>
      <a id="site" target="_blank" rel="noopener"></a>
    </div>
  </header>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form id="form">
    <input id="q" autocomplete="off" placeholder="Type a question…" aria-label="Your question">
    <button type="submit">Send</button>
  </form>
  <p class="note">Keyword-based example built from public info on the company's website.</p>
</div>

<script>
const DEMO = {"name":"Merenkurkun Majatalo","site":"https://www.merenkurkunmajatalo.fi/","hue":195,"intro":"Hi! I'm the Merenkurkun Majatalo assistant (example). Ask me about rooms, prices, saunas, the restaurant or events in Björköby.","chips":["What rooms do you have?","How much does a room cost?","Is breakfast included?","Can I book a sauna?","When is the restaurant open?","Can you host a meeting or party?"],"kb":[[[" hot tub"," palju"," jacuzzi"," tub"],"Hot tub (palju) heating can be ordered separately. Price: €280."],[[" breakfast"," aamiainen"],"Yes, a generous archipelago breakfast buffet is included in the room price."],[[" price"," prices"," cost"," how much"," rate"," rates"," euro"," hinta"],"Rooms 2, 3, 5 and 6 (shared facilities), per night: 1 person €80, 2 people €86, 3 people €120, 4 people €150. Rooms 1 and 4 (private shower and WC): 1 person €95, 2 people €100. Breakfast buffet and free Wi-Fi included. Prices may change."],[[" cancel"," cancellation"," refund"],"The cancellation fee is 50% of the total price if you cancel less than 3 days before arrival."],[[" wood"," electric"," sauna"," saunas"],"There are two saunas in the Aitta building: a large wood-heated sauna for about 17 people (€100, towels and toiletries included, booking needed, with a lounge where food and drinks can be ordered) and a small electric sauna for 6 people (€50). The electric sauna is included in the room rental."],[[" restaurant"," open"," opening"," hours"," dinner"," lunch"," pizza"," food"," eat"],"The restaurant is open on weekends: Fri 16-22, Sat 12-22, Sun 12-18 (closed exceptionally from late December to mid-March). Food is made from local produce, including homemade pizzas to eat in or take away. Lunch, dinner or a buffet for groups can be ordered in advance. Fully licensed (A-rights)."],[[" meeting"," meetings"," conference"," party"," parties"," wedding"," event"," events"," christmas"," tyky"," celebration"],"Yes! We host meetings (space for about 20 people, with all the equipment you need), Christmas parties, weddings, bachelor parties, team wellness days (tyky) and other celebrations, with custom lunch or dinner. Ask for a quote by phone +358 50 448 6790 or email merenkurkunmajatalo@gmail.com."],[[" room"," rooms"," stay"," accommodation"," cottage"," cabin"," bed"," beds"," sleep"],"Accommodation is year-round in the Aitta building with six rooms: two 3-person rooms (extra bed possible), two 4-person rooms and two 2-person rooms with private WC and shower (beds can be joined as a double). There is also a 24 m² cottage for up to 9 people, and in summer three small cottages for 2 people."],[[" towel"," towels"],"Towels for accommodation cost €5 per person. Sauna bookings include towels and toiletries."],[[" wifi"," wi fi"," internet"],"Free Wi-Fi is included."],[[" grill"," bbq"," barbecue"],"A grilling area is available for overnight guests."],[[" where"," address"," location"," directions"," vaasa"," find"],"We are at Rudträskvägen 6, 65870 Björköby, Mustasaari, in the beautiful Kvarken UNESCO World Heritage area, about 40 km from Vaasa."],[[" book"," booking"," reserve"," reservation"," contact"," phone"," email"," call"],"You can book or ask for a quote by phone +358 50 448 6790, by email merenkurkunmajatalo@gmail.com, or via the contact form on our website."]],"contact":"merenkurkunmajatalo@gmail.com / +358 50 448 6790"};

document.documentElement.style.setProperty("--hue", DEMO.hue ?? 200);
document.getElementById("name").textContent = DEMO.name;
document.getElementById("avatar").textContent = (DEMO.name || "?").trim().charAt(0).toUpperCase();
const siteLink = document.getElementById("site");
siteLink.href = DEMO.site;
siteLink.textContent = DEMO.site.replace(/^https?:\/\//, "").replace(/\/$/, "");

const log = document.getElementById("log");
function say(text, who) {
  const el = document.createElement("div");
  el.className = "msg " + who;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

function answer(question) {
  const text = " " + question.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ") + " ";
  for (const [keys, reply] of DEMO.kb) {
    if (keys.some(k => text.includes(k.toLowerCase()))) return reply;
  }
  return "I don't have that answer in this example. You can contact the team directly: " + DEMO.contact;
}

function ask(question) {
  question = question.trim();
  if (!question) return;
  say(question, "me");
  setTimeout(() => say(answer(question), "bot"), 350);
}

const chips = document.getElementById("chips");
for (const c of DEMO.chips) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = c;
  b.addEventListener("click", () => ask(c));
  chips.appendChild(b);
}

document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const q = document.getElementById("q");
  ask(q.value);
  q.value = "";
});

say(DEMO.intro, "bot");
</script>
</body>
</html>
