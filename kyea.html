<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Kuopion Yksityinen Eläinlääkäriasema Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
  :root {
    --hue: 200;
    --bg: hsl(var(--hue) 25% 96%);
    --panel: #ffffff;
    --ink: hsl(var(--hue) 30% 12%);
    --muted: hsl(var(--hue) 12% 42%);
    --line: hsl(var(--hue) 18% 88%);
    --accent: hsl(var(--hue) 62% 38%);
    --accent-ink: #ffffff;
    --bot: hsl(var(--hue) 30% 94%);
    --flag-bg: #fff4d6;
    --flag-ink: #6b4a00;
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: hsl(var(--hue) 22% 9%);
      --panel: hsl(var(--hue) 20% 13%);
      --ink: hsl(var(--hue) 20% 92%);
      --muted: hsl(var(--hue) 10% 66%);
      --line: hsl(var(--hue) 15% 24%);
      --accent: hsl(var(--hue) 60% 62%);
      --accent-ink: hsl(var(--hue) 40% 10%);
      --bot: hsl(var(--hue) 18% 19%);
      --flag-bg: #3a2f10;
      --flag-ink: #ffd98a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: hsl(var(--hue) 22% 9%);
    --panel: hsl(var(--hue) 20% 13%);
    --ink: hsl(var(--hue) 20% 92%);
    --muted: hsl(var(--hue) 10% 66%);
    --line: hsl(var(--hue) 15% 24%);
    --accent: hsl(var(--hue) 60% 62%);
    --accent-ink: hsl(var(--hue) 40% 10%);
    --bot: hsl(var(--hue) 18% 19%);
    --flag-bg: #3a2f10;
    --flag-ink: #ffd98a;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: inherit; font-size: 15px; line-height: 1.5;
    padding-inline: 16px; padding-block: 16px; box-sizing: border-box;
    display: flex; justify-content: center;
  }
  .app {
    width: 100%; max-width: 440px; height: 100%; max-height: 760px;
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  }
  .flag {
    background: var(--flag-bg); color: var(--flag-ink);
    font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    padding: 8px 14px; text-align: center;
  }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; flex: none;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-weight: 700;
  }
  header h1 { font-size: 16px; margin: 0; text-wrap: balance; }
  header a { font-size: 13px; color: var(--muted); text-decoration: none; }
  header a:hover { text-decoration: underline; }
  .log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .me { background: var(--accent); color: var(--accent-ink); align-self: flex-end; border-bottom-right-radius: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; }
  .chips button {
    font: inherit; font-size: 13px; cursor: pointer;
    background: transparent; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 999px; padding: 5px 11px;
  }
  .chips button:hover { background: var(--bot); }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  input {
    flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
  }
  form button {
    font: inherit; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 0 16px;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note { font-size: 12px; color: var(--muted); text-align: center; padding: 0 16px 12px; margin: 0; }
</style>

<div class="app">
  <div class="flag">EXAMPLE · demo chatbot, not official</div>
  <header>
    <div class="avatar" id="avatar"></div>
    <div>
      <h1 id="name"></h1>
      <a id="site" target="_blank" rel="noopener"></a>
    </div>
  </header>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form id="form">
    <input id="q" autocomplete="off" placeholder="Type a question…" aria-label="Your question">
    <button type="submit">Send</button>
  </form>
  <p class="note">Keyword-based example built from public info on the company's website.</p>
</div>

<script>
const DEMO = {"name":"Kuopion Yksityinen Eläinlääkäriasema","site":"https://kyea.fi/","hue":150,"intro":"Hi! I'm the example assistant for Kuopion Yksityinen Eläinlääkäriasema, a small animal clinic in Kuopio since 1984. Ask me about opening hours, booking, services, prices or our location.","chips":["What are your opening hours?","How do I book an appointment?","How much is a vaccination?","What services do you offer?","Where are you located?","What is the cancellation policy?"],"kb":[[[" cancel"," cancellation"," no show"," missed"],"If an appointment is not cancelled, the clinic charges 50% of the booked procedure's price, at least 40 €."],[[" vaccin"," vaccine"," vaccines"," vaccination"," vaccinations"," rabies"," shot"],"Vaccination prices (incl. VAT and clinic fee):\n- Dog 4-vaccine: 55 €\n- Dog 4-vaccine + rabies: 60 €\n- Cat 3-vaccine: 55 €\n- Cat 3-vaccine + rabies: 60 €"],[[" castration"," castrate"," neuter"," spay"," sterilisation"," sterilization"],"Prices (incl. VAT and clinic fee):\n- Cat castration: 95 €\n- Cat sterilisation: 150 €\n- Dog castration: 253 / 304 / 355 €\n- Dog sterilisation: 385 / 436 / 486 €"],[[" dental"," teeth"," tooth"," tartar"],"Dental care is offered. Prices (incl. VAT and clinic fee):\n- Tartar removal, cat: 193 €\n- Tartar removal, dog: 200-270 €\n- Removal of baby canine teeth: 152-245 €"],[[" kennel"," hip"," elbow"," official"," heart"," knee"," patella"," eye"],"The clinic does official Kennel Club examinations: hip and elbow X-rays, back X-rays, knee checks, heart auscultation and eye examinations. Official eye examinations take place on dates announced in the News section of the website. Examples (incl. VAT): official knee check 66 €, official heart auscultation 66 €, official hip X-ray 162 / 193 €."],[[" pregnan"," pregnancy"," pregnant"],"Pregnancy checks: ultrasound 81 €, X-ray 91 € (incl. VAT and clinic fee)."],[[" euthanasia"," put down"," cremation"],"The clinic offers euthanasia, with the option of cremation. Please call 017 2821268 to arrange it."],[[" hour"," hours"," open"," opening"," when"," time"],"The clinic serves on weekdays from 8 to 16 (8 am to 4 pm)."],[[" book"," booking"," appointment"," reserve"],"Appointments are booked by phone: 017 2821268. When you call, the clinic staff will ask about your pet and its care needs to assess how urgent the visit is."],[[" price"," prices"," cost"," costs"," fee"," how much"," visit"],"A basic visit costs 86-135 € (incl. VAT and clinic fee). You can see the full price list on the website under Hinnasto, or ask me about vaccinations, castration, dental care or pregnancy checks."],[[" service"," services"," offer"," treatment"," treatments"," surgery"," x ray"," xray"," ultrasound"," lab"," laboratory"," microchip"," chip"," passport"," puppy"],"Services include: vaccinations, microchipping, EU pet passports, puppy check-ups, official Kennel Club examinations, eye diseases, skin and ear diseases, X-ray, ultrasound, dental care, internal medicine, soft tissue surgery, sterilisations and castrations, laboratory tests, and euthanasia (with a cremation option)."],[[" food"," products"," product"," shop"," buy"," hills"," royal canin"," trovet"],"The clinic sells animal food and care products, including quality brands such as Hills, Royal Canin and Trovet. Ask the staff for more."],[[" where"," address"," location"," located"," find"],"The clinic is at Kiekkotie 2, 70200 Kuopio, next to the Puijonlaakso shopping centre."],[[" vet"," vets"," veterinarian"," staff"," team"," doctor"," nurse"],"Veterinarians: Sirje Salmela, Jari Aho, Jekaterina Dubinska and Kati Lehtimäki. Clinic animal nurses: Riina Turunen, Nina Reinisalo, Mara Parviainen and Essi Hujanen."],[[" animal"," animals"," dog"," cat"," pet"," pets"],"Kuopion Yksityinen Eläinlääkäriasema is a small animal clinic, founded in 1984. To book, call 017 2821268."],[[" contact"," phone"," call"," email"," mail"],"Phone: 017 2821268\nEmail: kyea@kyea.com\nAddress: Kiekkotie 2, 70200 Kuopio"]],"contact":"phone 017 2821268, kyea@kyea.com or https://kyea.fi/yhteystiedot/"};

document.documentElement.style.setProperty("--hue", DEMO.hue ?? 200);
document.getElementById("name").textContent = DEMO.name;
document.getElementById("avatar").textContent = (DEMO.name || "?").trim().charAt(0).toUpperCase();
const siteLink = document.getElementById("site");
siteLink.href = DEMO.site;
siteLink.textContent = DEMO.site.replace(/^https?:\/\//, "").replace(/\/$/, "");

const log = document.getElementById("log");
function say(text, who) {
  const el = document.createElement("div");
  el.className = "msg " + who;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

function answer(question) {
  const text = " " + question.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ") + " ";
  for (const [keys, reply] of DEMO.kb) {
    if (keys.some(k => text.includes(k.toLowerCase()))) return reply;
  }
  return "I don't have that answer in this example. You can contact the team directly: " + DEMO.contact;
}

function ask(question) {
  question = question.trim();
  if (!question) return;
  say(question, "me");
  setTimeout(() => say(answer(question), "bot"), 350);
}

const chips = document.getElementById("chips");
for (const c of DEMO.chips) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = c;
  b.addEventListener("click", () => ask(c));
  chips.appendChild(b);
}

document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const q = document.getElementById("q");
  ask(q.value);
  q.value = "";
});

say(DEMO.intro, "bot");
</script>

</body>
</html>
