<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>Autokoulu Tähti Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
  :root {
    --hue: 200;
    --bg: hsl(var(--hue) 25% 96%);
    --panel: #ffffff;
    --ink: hsl(var(--hue) 30% 12%);
    --muted: hsl(var(--hue) 12% 42%);
    --line: hsl(var(--hue) 18% 88%);
    --accent: hsl(var(--hue) 62% 38%);
    --accent-ink: #ffffff;
    --bot: hsl(var(--hue) 30% 94%);
    --flag-bg: #fff4d6;
    --flag-ink: #6b4a00;
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: hsl(var(--hue) 22% 9%);
      --panel: hsl(var(--hue) 20% 13%);
      --ink: hsl(var(--hue) 20% 92%);
      --muted: hsl(var(--hue) 10% 66%);
      --line: hsl(var(--hue) 15% 24%);
      --accent: hsl(var(--hue) 60% 62%);
      --accent-ink: hsl(var(--hue) 40% 10%);
      --bot: hsl(var(--hue) 18% 19%);
      --flag-bg: #3a2f10;
      --flag-ink: #ffd98a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: hsl(var(--hue) 22% 9%);
    --panel: hsl(var(--hue) 20% 13%);
    --ink: hsl(var(--hue) 20% 92%);
    --muted: hsl(var(--hue) 10% 66%);
    --line: hsl(var(--hue) 15% 24%);
    --accent: hsl(var(--hue) 60% 62%);
    --accent-ink: hsl(var(--hue) 40% 10%);
    --bot: hsl(var(--hue) 18% 19%);
    --flag-bg: #3a2f10;
    --flag-ink: #ffd98a;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: inherit; font-size: 15px; line-height: 1.5;
    padding-inline: 16px; padding-block: 16px; box-sizing: border-box;
    display: flex; justify-content: center;
  }
  .app {
    width: 100%; max-width: 440px; height: 100%; max-height: 760px;
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  }
  .flag {
    background: var(--flag-bg); color: var(--flag-ink);
    font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    padding: 8px 14px; text-align: center;
  }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; flex: none;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-weight: 700;
  }
  header h1 { font-size: 16px; margin: 0; text-wrap: balance; }
  header a { font-size: 13px; color: var(--muted); text-decoration: none; }
  header a:hover { text-decoration: underline; }
  .log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .me { background: var(--accent); color: var(--accent-ink); align-self: flex-end; border-bottom-right-radius: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; }
  .chips button {
    font: inherit; font-size: 13px; cursor: pointer;
    background: transparent; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 999px; padding: 5px 11px;
  }
  .chips button:hover { background: var(--bot); }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  input {
    flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
  }
  form button {
    font: inherit; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 0 16px;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note { font-size: 12px; color: var(--muted); text-align: center; padding: 0 16px 12px; margin: 0; }
</style>

</head>
<body>
<div class="app">
  <div class="flag">EXAMPLE · demo chatbot, not official</div>
  <header>
    <div class="avatar" id="avatar"></div>
    <div>
      <h1 id="name"></h1>
      <a id="site" target="_blank" rel="noopener"></a>
    </div>
  </header>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form id="form">
    <input id="q" autocomplete="off" placeholder="Type a question…" aria-label="Your question">
    <button type="submit">Send</button>
  </form>
  <p class="note">Keyword-based example built from public info on the company's website.</p>
</div>

<script>
const DEMO = {"name":"Autokoulu Tähti","site":"https://autokoulutahti.fi/","hue":45,"intro":"Hi! I'm the Autokoulu Tähti assistant (example). Ask me about car, moped and motorcycle courses, prices or how to enroll.","chips":["How much is the car course?","What's included in the car course?","Do you offer automatic cars?","How much is the moped course?","Motorcycle course prices?","How do I enroll?"],"kb":[[[" enroll"," enrol"," sign up"," register"," registration"," join"," start"],"You can enroll online here: https://autokoulutahti.drima.app/enrollment. Questions first? Call +358 400 131177 or email autokoulutahti@gmail.com."],[[" moped"," mopo"," am120"," am "," scooter"],"Moped course (AM120): €220/145. Includes study materials, EAS safety training, 2/1 driving lessons, riding gear and the moped for your first exam. Extra costs: extra lessons €60, handling exam €36, theory exam €46, licence fee €28/45. Steps: enroll, complete the online safety theory, pass the theory exam, then the handling exam."],[[" motorcycle"," motorbike"," bike"," a1"," a2"," moottoripy"," upgrade"],"Motorcycle courses A1, A2 and A: €360 each. Includes study materials, EAS safety training, 5 driving lessons, gear and the motorcycle for the exams. Extra costs: theory exam €46-48, handling and riding test €85, licence fee €28/45, extra lessons €60. Minimum age: A1 16 (studies can start at 15), A2 18, A 24. Licence class upgrade: €300 (2h theory, 5 driving lessons, gear, €45 licence fee)."],[[" automatic"," manual"," gearbox"," transmission"],"Yes, the car (B) course is available with either a manual or an automatic car."],[[" rtk"," risk"," dark"," night"," slippery"," second stage"],"Risk identification training (RTK) on its own costs €350: 7h RTK with online theory lessons, night driving on the simulator, highway driving by car, slippery-road training on the simulator and an individual skills assessment. RTK is already included in the €995 car course."],[[" extra lesson"," additional lesson"," more lessons"," lesson price"," per lesson"],"Extra driving lessons cost €60 each."],[[" pick"," pickup"," home"," school"],"Driving lessons can start from your home or school: the pickup place is agreed with the instructor."],[[" theory"," online"," class"," classes"],"Theory lessons are held online. Driving practice is done with the instructor in the car (and partly on the simulator)."],[[" car"," b licence"," b license"," b class"," category b"," driving licence"," driving license"," included"," include"," simulator"],"Car course (B), new-law price: €995. Includes study materials, EAS safety training, risk identification training (RTK) and 15 driving lessons (50 min each): 11 by car + 4 on the simulator. Option with 13 car + 2 simulator lessons: €1090. The car is included for the first exam. Extra costs: slippery-road track fee €60, extra lessons €60, exam fees €156, licence fee €28/45."],[[" price"," prices"," cost"," how much"," fee"," fees"," cheap"],"Main prices: car course (B) €995, moped course €220/145, motorcycle courses A1/A2/A €360, licence class upgrade €300, RTK alone €350. Full list: https://autokoulutahti.fi/hinnasto/"],[[" where"," address"," location"," located"," tampere"," office"],"Autokoulu Tähti is at Kämmenmaankatu 33, 34240 Tampere."],[[" teacher"," instructor"," who"," owner"],"Teaching is led by driving instructor Timo Hilden. Autokoulu Tähti describes itself as a traditional driving school from Tampere."],[[" contact"," phone"," call"," email"," mail"," number"],"Phone: +358 400 131177. Email: autokoulutahti@gmail.com. Address: Kämmenmaankatu 33, 34240 Tampere."]],"contact":"+358 400 131177 or autokoulutahti@gmail.com"};

document.documentElement.style.setProperty("--hue", DEMO.hue ?? 200);
document.getElementById("name").textContent = DEMO.name;
document.getElementById("avatar").textContent = (DEMO.name || "?").trim().charAt(0).toUpperCase();
const siteLink = document.getElementById("site");
siteLink.href = DEMO.site;
siteLink.textContent = DEMO.site.replace(/^https?:\/\//, "").replace(/\/$/, "");

const log = document.getElementById("log");
function say(text, who) {
  const el = document.createElement("div");
  el.className = "msg " + who;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

function answer(question) {
  const text = " " + question.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ") + " ";
  for (const [keys, reply] of DEMO.kb) {
    if (keys.some(k => text.includes(k.toLowerCase()))) return reply;
  }
  return "I don't have that answer in this example. You can contact the team directly: " + DEMO.contact;
}

function ask(question) {
  question = question.trim();
  if (!question) return;
  say(question, "me");
  setTimeout(() => say(answer(question), "bot"), 350);
}

const chips = document.getElementById("chips");
for (const c of DEMO.chips) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = c;
  b.addEventListener("click", () => ask(c));
  chips.appendChild(b);
}

document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const q = document.getElementById("q");
  ask(q.value);
  q.value = "";
});

say(DEMO.intro, "bot");
</script>
</body>
</html>
