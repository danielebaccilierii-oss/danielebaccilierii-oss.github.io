<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>FysioTuki Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
  :root {
    --hue: 200;
    --bg: hsl(var(--hue) 25% 96%);
    --panel: #ffffff;
    --ink: hsl(var(--hue) 30% 12%);
    --muted: hsl(var(--hue) 12% 42%);
    --line: hsl(var(--hue) 18% 88%);
    --accent: hsl(var(--hue) 62% 38%);
    --accent-ink: #ffffff;
    --bot: hsl(var(--hue) 30% 94%);
    --flag-bg: #fff4d6;
    --flag-ink: #6b4a00;
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: hsl(var(--hue) 22% 9%);
      --panel: hsl(var(--hue) 20% 13%);
      --ink: hsl(var(--hue) 20% 92%);
      --muted: hsl(var(--hue) 10% 66%);
      --line: hsl(var(--hue) 15% 24%);
      --accent: hsl(var(--hue) 60% 62%);
      --accent-ink: hsl(var(--hue) 40% 10%);
      --bot: hsl(var(--hue) 18% 19%);
      --flag-bg: #3a2f10;
      --flag-ink: #ffd98a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: hsl(var(--hue) 22% 9%);
    --panel: hsl(var(--hue) 20% 13%);
    --ink: hsl(var(--hue) 20% 92%);
    --muted: hsl(var(--hue) 10% 66%);
    --line: hsl(var(--hue) 15% 24%);
    --accent: hsl(var(--hue) 60% 62%);
    --accent-ink: hsl(var(--hue) 40% 10%);
    --bot: hsl(var(--hue) 18% 19%);
    --flag-bg: #3a2f10;
    --flag-ink: #ffd98a;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: inherit; font-size: 15px; line-height: 1.5;
    padding-inline: 16px; padding-block: 16px; box-sizing: border-box;
    display: flex; justify-content: center;
  }
  .app {
    width: 100%; max-width: 440px; height: 100%; max-height: 760px;
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  }
  .flag {
    background: var(--flag-bg); color: var(--flag-ink);
    font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    padding: 8px 14px; text-align: center;
  }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; flex: none;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-weight: 700;
  }
  header h1 { font-size: 16px; margin: 0; text-wrap: balance; }
  header a { font-size: 13px; color: var(--muted); text-decoration: none; }
  header a:hover { text-decoration: underline; }
  .log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .me { background: var(--accent); color: var(--accent-ink); align-self: flex-end; border-bottom-right-radius: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; }
  .chips button {
    font: inherit; font-size: 13px; cursor: pointer;
    background: transparent; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 999px; padding: 5px 11px;
  }
  .chips button:hover { background: var(--bot); }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  input {
    flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
  }
  form button {
    font: inherit; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 0 16px;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note { font-size: 12px; color: var(--muted); text-align: center; padding: 0 16px 12px; margin: 0; }
</style>

</head>
<body>
<div class="app">
  <div class="flag">EXAMPLE · demo chatbot, not official</div>
  <header>
    <div class="avatar" id="avatar"></div>
    <div>
      <h1 id="name"></h1>
      <a id="site" target="_blank" rel="noopener"></a>
    </div>
  </header>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form id="form">
    <input id="q" autocomplete="off" placeholder="Type a question…" aria-label="Your question">
    <button type="submit">Send</button>
  </form>
  <p class="note">Keyword-based example built from public info on the company's website.</p>
</div>

<script>
const DEMO = {"name":"FysioTuki","site":"https://www.fysiotuki.fi","hue":170,"intro":"Hi! I'm the FysioTuki example assistant. Ask me about our therapies, prices, opening hours, booking or our medical aids store in Järvenpää.","chips":["What are your opening hours?","Where are you located?","How much does physiotherapy cost?","Do you do home visits?","How can I book?","What is your cancellation policy?"],"kb":[[[" cancel"," cancellation"," no show"," peru"],"No-shows and same-day cancellations are charged 50% of the treatment price."],[[" home visit"," home"," visit"," kotikäynti"],"Yes, we offer physiotherapy home visits: 45 min 100€ and 60 min 120€ (40€ / 48€ after tax deduction). Travel fee: under 10 km 10€, 10-20 km 20€. Compression garment measurement at home: Järvenpää area 80€ (fitting visit 60€), surrounding municipalities 120€ (fitting visit 80€)."],[[" compression"," stocking"," sleeve"," measure"],"We measure and fit medical compression garments: measurement under 30 min 45€, over 30 min 62€. Usage guidance and device selection 30 min 40€, over 30 min 60€. Compression stockings and sleeves are also sold in our store."],[[" lymph"],"Lymph therapy is available in sessions of 30-90 min, priced 58-115€."],[[" baby"," infant"],"We offer baby massage and guidance for parents. Price: 55€."],[[" massage"," sports massage"," dry needling"," needling"],"We offer sports massage, massage therapy and dry needling. Massage sessions are 30-90 min, priced 45-105€."],[[" foot"," feet"," orthotic"," insole"],"Foot therapy 30-60 min: 50-75€. Foot care 30-60 min: 40-75€. Custom foot orthotics: 280€ (additional pair 150€)."],[[" price"," prices"," cost"," how much"," physio"," physiotherapy"],"Physiotherapy at the clinic: 30 min 50€, 45 min 65€, 60 min 75€. The full price list is at fysiotuki.fi/hinnasto."],[[" hour"," hours"," open"," opening"," when"],"We are open Monday-Thursday 10:00-17:00 and Friday 10:00-16:00."],[[" where"," address"," location"," located"," parking"," park"," station"],"We are at Asemakatu 4 (Asema-aukio), 04400 Järvenpää, next to the railway station. Ground floor, barrier-free access, with parking in front of the store."],[[" book"," booking"," appointment"," reserve"],"You can book online at fysiotuki.fi/ajanvaraus or call 040 576 2010."],[[" store"," shop"," aid"," aids"," crutch"," rollator"," support"," shoe"," shoes"],"Our store sells medical aids: compression stockings and sleeves, joint supports (ankle, knee, hip, back), crutches and rollators, foot orthotics and insoles, bathroom and kitchen aids, and footwear such as walking shoes, sandals and winter boots."],[[" area"," kerava"," tuusula"," mäntsälä"," pornainen"," hyvinkää"],"We serve the Keski-Uusimaa region: Järvenpää, Kerava, Tuusula, Mäntsälä, Pornainen and Hyvinkää."],[[" staff"," team"," who"," therapist"],"Our team includes physiotherapists, lymph therapists, compression product specialists, a foot therapist, a massage therapist and a foot care specialist. See fysiotuki.fi/henkilokunta for details."],[[" service"," services"," treatment"," therapy"," 6d"],"We offer physiotherapy, sports massage and massage therapy, dry needling, lymph therapy, foot therapy, baby massage, home visits, compression garment fitting and 6D negative pressure therapy, plus a medical aids store."],[[" contact"," email"," phone"," call"],"Call 040 576 2010 or email info@fysiotuki.fi."]],"contact":"info@fysiotuki.fi / 040 576 2010"};

document.documentElement.style.setProperty("--hue", DEMO.hue ?? 200);
document.getElementById("name").textContent = DEMO.name;
document.getElementById("avatar").textContent = (DEMO.name || "?").trim().charAt(0).toUpperCase();
const siteLink = document.getElementById("site");
siteLink.href = DEMO.site;
siteLink.textContent = DEMO.site.replace(/^https?:\/\//, "").replace(/\/$/, "");

const log = document.getElementById("log");
function say(text, who) {
  const el = document.createElement("div");
  el.className = "msg " + who;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

function answer(question) {
  const text = " " + question.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ") + " ";
  for (const [keys, reply] of DEMO.kb) {
    if (keys.some(k => text.includes(k.toLowerCase()))) return reply;
  }
  return "I don't have that answer in this example. You can contact the team directly: " + DEMO.contact;
}

function ask(question) {
  question = question.trim();
  if (!question) return;
  say(question, "me");
  setTimeout(() => say(answer(question), "bot"), 350);
}

const chips = document.getElementById("chips");
for (const c of DEMO.chips) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = c;
  b.addEventListener("click", () => ask(c));
  chips.appendChild(b);
}

document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const q = document.getElementById("q");
  ask(q.value);
  q.value = "";
});

say(DEMO.intro, "bot");
</script>
</body>
</html>
