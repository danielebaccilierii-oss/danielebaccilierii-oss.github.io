<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>Autokoulu Lilliputti Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
  :root {
    --hue: 200;
    --bg: hsl(var(--hue) 25% 96%);
    --panel: #ffffff;
    --ink: hsl(var(--hue) 30% 12%);
    --muted: hsl(var(--hue) 12% 42%);
    --line: hsl(var(--hue) 18% 88%);
    --accent: hsl(var(--hue) 62% 38%);
    --accent-ink: #ffffff;
    --bot: hsl(var(--hue) 30% 94%);
    --flag-bg: #fff4d6;
    --flag-ink: #6b4a00;
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: hsl(var(--hue) 22% 9%);
      --panel: hsl(var(--hue) 20% 13%);
      --ink: hsl(var(--hue) 20% 92%);
      --muted: hsl(var(--hue) 10% 66%);
      --line: hsl(var(--hue) 15% 24%);
      --accent: hsl(var(--hue) 60% 62%);
      --accent-ink: hsl(var(--hue) 40% 10%);
      --bot: hsl(var(--hue) 18% 19%);
      --flag-bg: #3a2f10;
      --flag-ink: #ffd98a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: hsl(var(--hue) 22% 9%);
    --panel: hsl(var(--hue) 20% 13%);
    --ink: hsl(var(--hue) 20% 92%);
    --muted: hsl(var(--hue) 10% 66%);
    --line: hsl(var(--hue) 15% 24%);
    --accent: hsl(var(--hue) 60% 62%);
    --accent-ink: hsl(var(--hue) 40% 10%);
    --bot: hsl(var(--hue) 18% 19%);
    --flag-bg: #3a2f10;
    --flag-ink: #ffd98a;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: inherit; font-size: 15px; line-height: 1.5;
    padding-inline: 16px; padding-block: 16px; box-sizing: border-box;
    display: flex; justify-content: center;
  }
  .app {
    width: 100%; max-width: 440px; height: 100%; max-height: 760px;
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  }
  .flag {
    background: var(--flag-bg); color: var(--flag-ink);
    font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    padding: 8px 14px; text-align: center;
  }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; flex: none;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-weight: 700;
  }
  header h1 { font-size: 16px; margin: 0; text-wrap: balance; }
  header a { font-size: 13px; color: var(--muted); text-decoration: none; }
  header a:hover { text-decoration: underline; }
  .log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .me { background: var(--accent); color: var(--accent-ink); align-self: flex-end; border-bottom-right-radius: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; }
  .chips button {
    font: inherit; font-size: 13px; cursor: pointer;
    background: transparent; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 999px; padding: 5px 11px;
  }
  .chips button:hover { background: var(--bot); }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  input {
    flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
  }
  form button {
    font: inherit; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 0 16px;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note { font-size: 12px; color: var(--muted); text-align: center; padding: 0 16px 12px; margin: 0; }
</style>

</head>
<body>
<div class="app">
  <div class="flag">EXAMPLE · demo chatbot, not official</div>
  <header>
    <div class="avatar" id="avatar"></div>
    <div>
      <h1 id="name"></h1>
      <a id="site" target="_blank" rel="noopener"></a>
    </div>
  </header>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form id="form">
    <input id="q" autocomplete="off" placeholder="Type a question…" aria-label="Your question">
    <button type="submit">Send</button>
  </form>
  <p class="note">Keyword-based example built from public info on the company's website.</p>
</div>

<script>
const DEMO = {"name":"Autokoulu Lilliputti","site":"https://www.lilliputti.com","hue":28,
"intro":"Hi! I'm the Autokoulu Lilliputti assistant. Ask me about car, moped and motorcycle licence courses, prices, theory lessons, opening hours or how to sign up.",
"chips":["Car licence prices?","Moped licence (AM120)?","A2 motorcycle licence?","Which languages is theory in?","Where do driving lessons start?","Opening hours?"],
"kb":[
[[" moped"," mopo"," am120"," scooter"],"Moped licence (AM120), taught by an SMOK-authorised instructor:\n- Narrow course: 195 € + official fees (1 handling lesson)\n- Standard course: 279 € + official fees (2 handling lessons)\nBoth include 4 h EAS safety training, e-learning materials, theory exam practice, the moped for the first handling exam and riding gear. Handling lessons can start after you turn 15. Official fees: licence permit 28 € (electronic), theory exam 46 €, handling exam 36 €."],
[[" a2"," motorcycle"," motorbike"," moottoripy"],"A2 motorcycle licence (from age 18):\n- Full course: 555–599 € + official fees (5 lessons on the school's motorcycle, 4 h EAS training, materials, motorcycle and gear for the tests)\n- Upgrade from A1 (min. 2 years of A1 riding): 449 € + 45 € official fees\n- Exams only: 210 € + official fees\nLilliputti also offers A1 and A courses, and specialises in moped and motorcycle training."],
[[" a1"," light motorcycle"," kevari"," a licence"," a class"],"Lilliputti offers A1 (light motorcycle), A2 and A motorcycle licence courses, plus upgrade courses. Details and prices are on lilliputti.com/kurssit."],
[[" truck"," c1"," lorry"," tractor"," traktori"],"Lilliputti also offers C1 and C1E upgrade training (truck licence) and a tractor licence course. See lilliputti.com/kurssit for details."],
[[" language"," english"," swedish"," finnish"],"For the car (B) licence, theory teaching is available in Finnish, Swedish or English."],
[[" theory"," online"," eas"," rtk"," risk"],"Theory is taught online. For the car licence: 4 h EAS (only for a first licence) and 7 h risk recognition training (RTK) theory. From 1.10.2026 RTK expands to 7 theory hours and 5 driving hours, and all B courses include it."],
[[" automatic"," manual"," gear"," biogas"," car type"],"Car lessons use biogas cars, with both manual and automatic options."],
[[" simulator"],"Lilliputti uses a driving simulator, e.g. for night and slippery-road driving. The Simulator course (1099 €) suits people who already hold a licence such as moped or A1/A2/A."],
[[" where"," start"," pick"," location"," metro"," meet"],"Driving lessons normally start from the office at Siilitie 4, but can also start from: Herttoniemi, Siilitie, Itäkeskus, Puotila, Rastila, Vuosaari or Myllypuro metro stations; Pukinmäki or Malmi train stations; Viikki K-Supermarket, ABC Pihlajisto, Pihlajamäki shopping centre or Shell Savela."],
[[" hour"," open"," when"," time"],"Office hours: Mon–Thu 14:00–18:00, closed Fri–Sun. Outside these hours you can leave a call-back request at 045 112 1900. Driving lessons are held on weekdays 7:00–18:00."],
[[" extra lesson"," additional lesson"," lesson price"],"Extra car driving lessons cost 87 € per 50-minute lesson."],
[[" pay"," instal"," invoice"," credit"," finance"],"You can pay online at sign-up (card, online banking, instalments), choose an invoice (for minors the guardian pays), or use a Resurs Bank driving school account with up to 12 months interest-free (minimum credit limit 2000 €)."],
[[" sign"," enrol"," enroll"," register"," book"," join"],"Sign up online via the form on each course page (or by phone/SMS at 045 112 1900). The office confirms your registration and you then get access to the e-learning materials. After that, apply for the licence permit electronically through Traficom."],
[[" car"," b licence"," b course"," price"," cost"," how much"," driving licence"," ajokortti"],"Car (B) licence courses (prices exclude official fees):\n- Simulator course: 1099 € (7.5 h car + 7.5 h simulator)\n- Basic course: 1499 € (12 h car + 3 h simulator)\n- Luxury: 1699 € (15 h car)\n- Luxury+: 2099 € (19 h car, unlimited simulator)\nAll include the car for the first test, e-textbook and theory test practice. Lilliputti also offers licence courses with a teaching permit (opetuslupa)."],
[[" official fee"," fees"," exam"," test"],"Official fees for the car licence: licence application 28 € (electronic) or 45 € (paper), theory exam 46 €, driving test 110 €."],
[[" assessment"," rusty"," refresh"],"Lilliputti offers driving ability assessments (ajokyvyn arviointi) and lessons for drivers whose skills are a bit rusty."],
[[" address"," located"," contact"," phone"," email"," call"],"Autokoulu Lilliputti, Siilitie 4, 00800 Helsinki (next to Siilitie metro station). Phone 045 112 1900, email info@lilliputti.com."],
[[" hello"," hi "," hey"],"Hello! Ask me about courses, prices, theory, lesson locations or opening hours."]
],
"contact":"info@lilliputti.com · 045 112 1900"};

document.documentElement.style.setProperty("--hue", DEMO.hue ?? 200);
document.getElementById("name").textContent = DEMO.name;
document.getElementById("avatar").textContent = (DEMO.name || "?").trim().charAt(0).toUpperCase();
const siteLink = document.getElementById("site");
siteLink.href = DEMO.site;
siteLink.textContent = DEMO.site.replace(/^https?:\/\//, "").replace(/\/$/, "");

const log = document.getElementById("log");
function say(text, who) {
  const el = document.createElement("div");
  el.className = "msg " + who;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

function answer(question) {
  const text = " " + question.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ") + " ";
  for (const [keys, reply] of DEMO.kb) {
    if (keys.some(k => text.includes(k.toLowerCase()))) return reply;
  }
  return "I don't have that answer in this example. You can contact the team directly: " + DEMO.contact;
}

function ask(question) {
  question = question.trim();
  if (!question) return;
  say(question, "me");
  setTimeout(() => say(answer(question), "bot"), 350);
}

const chips = document.getElementById("chips");
for (const c of DEMO.chips) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = c;
  b.addEventListener("click", () => ask(c));
  chips.appendChild(b);
}

document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const q = document.getElementById("q");
  ask(q.value);
  q.value = "";
});

say(DEMO.intro, "bot");
</script>
</body>
</html>
