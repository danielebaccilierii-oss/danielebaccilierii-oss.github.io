<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Eläinklinikka Timantti Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
  :root {
    --hue: 200;
    --bg: hsl(var(--hue) 25% 96%);
    --panel: #ffffff;
    --ink: hsl(var(--hue) 30% 12%);
    --muted: hsl(var(--hue) 12% 42%);
    --line: hsl(var(--hue) 18% 88%);
    --accent: hsl(var(--hue) 62% 38%);
    --accent-ink: #ffffff;
    --bot: hsl(var(--hue) 30% 94%);
    --flag-bg: #fff4d6;
    --flag-ink: #6b4a00;
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: hsl(var(--hue) 22% 9%);
      --panel: hsl(var(--hue) 20% 13%);
      --ink: hsl(var(--hue) 20% 92%);
      --muted: hsl(var(--hue) 10% 66%);
      --line: hsl(var(--hue) 15% 24%);
      --accent: hsl(var(--hue) 60% 62%);
      --accent-ink: hsl(var(--hue) 40% 10%);
      --bot: hsl(var(--hue) 18% 19%);
      --flag-bg: #3a2f10;
      --flag-ink: #ffd98a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: hsl(var(--hue) 22% 9%);
    --panel: hsl(var(--hue) 20% 13%);
    --ink: hsl(var(--hue) 20% 92%);
    --muted: hsl(var(--hue) 10% 66%);
    --line: hsl(var(--hue) 15% 24%);
    --accent: hsl(var(--hue) 60% 62%);
    --accent-ink: hsl(var(--hue) 40% 10%);
    --bot: hsl(var(--hue) 18% 19%);
    --flag-bg: #3a2f10;
    --flag-ink: #ffd98a;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: inherit; font-size: 15px; line-height: 1.5;
    padding-inline: 16px; padding-block: 16px; box-sizing: border-box;
    display: flex; justify-content: center;
  }
  .app {
    width: 100%; max-width: 440px; height: 100%; max-height: 760px;
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  }
  .flag {
    background: var(--flag-bg); color: var(--flag-ink);
    font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    padding: 8px 14px; text-align: center;
  }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; flex: none;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-weight: 700;
  }
  header h1 { font-size: 16px; margin: 0; text-wrap: balance; }
  header a { font-size: 13px; color: var(--muted); text-decoration: none; }
  header a:hover { text-decoration: underline; }
  .log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .me { background: var(--accent); color: var(--accent-ink); align-self: flex-end; border-bottom-right-radius: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; }
  .chips button {
    font: inherit; font-size: 13px; cursor: pointer;
    background: transparent; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 999px; padding: 5px 11px;
  }
  .chips button:hover { background: var(--bot); }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  input {
    flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
  }
  form button {
    font: inherit; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 0 16px;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note { font-size: 12px; color: var(--muted); text-align: center; padding: 0 16px 12px; margin: 0; }
</style>

<div class="app">
  <div class="flag">EXAMPLE · demo chatbot, not official</div>
  <header>
    <div class="avatar" id="avatar"></div>
    <div>
      <h1 id="name"></h1>
      <a id="site" target="_blank" rel="noopener"></a>
    </div>
  </header>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form id="form">
    <input id="q" autocomplete="off" placeholder="Type a question…" aria-label="Your question">
    <button type="submit">Send</button>
  </form>
  <p class="note">Keyword-based example built from public info on the company's website.</p>
</div>

<script>
const DEMO = {"name":"Eläinklinikka Timantti","site":"https://www.elainklinikkatimantti.com/","hue":175,"intro":"Hi! I'm an example assistant for Eläinklinikka Timantti, a small animal clinic in Härmälä, Tampere. Ask me about opening hours, booking, prices or services.","chips":["What are your opening hours?","How do I book an appointment?","How much is a vaccination?","Do you offer dog grooming?","Where are you located?","What is your cancellation policy?"],"kb":[[[" cancel"," reschedul"],"Cancellation policy: if you cancel at least 24 hours before your appointment (by email, phone or Avoinna24), there is no charge. Cancellations less than 24 hours before, by email or phone, are charged 50% of the service price. If you don't cancel at all, the full price is charged."],[[" park"],"There are several free customer parking spaces on the clinic's property."],[[" where"," address"," locat"," direction"," bus"," find you"," get there"],"We're at Leirintäkatu 2, 33900 Tampere (Härmälä), in a quiet spot at the edge of the forest about 4 km from the city centre.\nBy bus: stops on Nuolialantie, close to the clinic.\nBy car: from the centre, or from the E12 bypass at the Messukeskus junction (about 2 km to the clinic).\nFree parking on site."],[[" hour"," open"," when "," closed"],"Shop and phone booking are open:\nTue & Wed 10–15\nThu 10–18\nAt other times, clinic services are by appointment."],[[" book"," appointment"," reserv"],"You can book online (Avoinna24 booking on our website), by email at info@elainklinikkatimantti.com, or by phone at 050 324 7550 (phone booking Tue & Wed 10–15, Thu 10–18)."],[[" vaccin"," rabies"," kennel cough"," shot"],"Vaccination prices:\nDogs: 4-in-1 vaccine (distemper, parvo, hepatitis, kennel cough) 68 €; with rabies 75 €; kennel cough vaccine 65 €.\nCats: triple vaccine (panleukopenia, calici, herpes) 68 €; with rabies 75 €.\nVaccination + microchip 105–112 €, vaccination + EU passport 126–133 €."],[[" microchip"," chip"," passport"," travel"," echinococc"],"Microchipping 79 €, EU pet passport 83 €. Vaccination + EU passport + microchip 163–170 €. Echinococcus certificate for dogs, with deworming assessment: 46 € + medication."],[[" groom"," trim"," bath"," wash"," undercoat"," pluck"],"Yes, we groom dogs: scissor work, clipper cuts, tidying, plucking, baths and undercoat removal. We do home trims for all dog types (no breed-standard show trims), plus puppy grooming introductions. Grooming can be booked online with our groomers via Avoinna24, by email or by phone."],[[" skin"," itch"," allerg"," stomach"," digest"," intestin"," gut"," diarr"," special"],"We're a small animal clinic specialised in skin and intestinal problems. Examples: acute skin symptoms 135 €, chronic 172 €; acute digestive symptoms 118 €, chronic from 155 € (lab and medication costs extra)."],[[" nutrition"," diet"," food"," feed"," lunderland"," naturopath"],"Nutrition counselling is given by animal naturopath Sanna Jönkkäri: a full assessment of your pet's health, diet history and a written plan with follow-up. First consultation 95 €/h, follow-ups 92 €/h. Phone consultations are possible. 10% off products bought during the appointment."],[[" ultrasound"," scan"],"Abdominal ultrasound: from 178 € (limited, without sedation, 30 min) up to 367 € (extensive with blood sampling, under sedation, 1h15min) + medication and lab costs."],[[" neuter"," castrat"],"Cat surgical castration 136 €. Dog chemical castration with a Suprelorin implant: 87 € + implant (6 months about 94 €, 12 months about 172 €)."],[[" puppy"," puppies"," litter"," pregnan"],"Pregnancy check with ultrasound (15 min) 99 €. Litter check: 1 puppy 89 €, 2–4 puppies 116–142 €; with microchipping, 1 puppy 118 €."],[[" euthan"," put down"," put to sleep"," cremat"],"Euthanasia: cat 122 €, dog under 20 kg 132 €, dog over 20 kg 159 € (+ medication about 10–60 €). Communal cremation can also be arranged, priced by weight."],[[" check up"," checkup"," health check"," senior"," price"," cost"," how much"," fee"],"Health check, no symptoms (15 min) 87 €. Health check with symptoms (30 min) from 118 €. Senior check for pets over 7 years (no symptoms, 30 min) 118 €. Extra costs may apply, e.g. medication and laboratory tests. Full price lists are on our website."],[[" massage"," rehab"," physio"," craniosacral"," exercise"," gym"," body care"],"For dogs we offer body care and rehabilitation: craniosacral therapy, physiotherapy, sports dog massage and dog exercise sessions (koirajumppa)."],[[" behav"," training"," welfare"],"We offer behavioural counselling, practice visits at the clinic, a dog everyday-welfare assessment, and guidance on the interaction between dog and owner."],[[" vet "," veterinarian"," doctor"," staff"," who "],"Our veterinarian is Kaisa Viitala. Nutrition counselling is by Sanna Jönkkäri. Both focus especially on skin and intestinal problems."],[[" cat "," cats"," dog "," dogs"," animals"," species"," pets"],"We're a small animal clinic providing veterinary care for dogs and cats."],[[" phone"," email"," contact"," call"," consult by phone"],"Phone: 050 324 7550 (Tue & Wed 10–15, Thu 10–18). Email: info@elainklinikkatimantti.com. Phone appointments with the vet are also available: up to 15 min 59 €, up to 30 min 85 €."],[[" form"," questionnaire"," before the visit"],"Pre-visit forms and a follow-up form are available on our website under 'Esitietolomakkeet'."],[[" shop"," store"," buy"],"Our shop is open Tue & Wed 10–15 and Thu 10–18. There's also an online shop with products for dogs and cats and the Lunderland home-food range."]],"contact":"info@elainklinikkatimantti.com · 050 324 7550"};

document.documentElement.style.setProperty("--hue", DEMO.hue ?? 200);
document.getElementById("name").textContent = DEMO.name;
document.getElementById("avatar").textContent = (DEMO.name || "?").trim().charAt(0).toUpperCase();
const siteLink = document.getElementById("site");
siteLink.href = DEMO.site;
siteLink.textContent = DEMO.site.replace(/^https?:\/\//, "").replace(/\/$/, "");

const log = document.getElementById("log");
function say(text, who) {
  const el = document.createElement("div");
  el.className = "msg " + who;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

function answer(question) {
  const text = " " + question.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ") + " ";
  for (const [keys, reply] of DEMO.kb) {
    if (keys.some(k => text.includes(k.toLowerCase()))) return reply;
  }
  return "I don't have that answer in this example. You can contact the team directly: " + DEMO.contact;
}

function ask(question) {
  question = question.trim();
  if (!question) return;
  say(question, "me");
  setTimeout(() => say(answer(question), "bot"), 350);
}

const chips = document.getElementById("chips");
for (const c of DEMO.chips) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = c;
  b.addEventListener("click", () => ask(c));
  chips.appendChild(b);
}

document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const q = document.getElementById("q");
  ask(q.value);
  q.value = "";
});

say(DEMO.intro, "bot");
</script>

</body>
</html>
