<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>Huone Escapes Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
  :root {
    --hue: 200;
    --bg: hsl(var(--hue) 25% 96%);
    --panel: #ffffff;
    --ink: hsl(var(--hue) 30% 12%);
    --muted: hsl(var(--hue) 12% 42%);
    --line: hsl(var(--hue) 18% 88%);
    --accent: hsl(var(--hue) 62% 38%);
    --accent-ink: #ffffff;
    --bot: hsl(var(--hue) 30% 94%);
    --flag-bg: #fff4d6;
    --flag-ink: #6b4a00;
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: hsl(var(--hue) 22% 9%);
      --panel: hsl(var(--hue) 20% 13%);
      --ink: hsl(var(--hue) 20% 92%);
      --muted: hsl(var(--hue) 10% 66%);
      --line: hsl(var(--hue) 15% 24%);
      --accent: hsl(var(--hue) 60% 62%);
      --accent-ink: hsl(var(--hue) 40% 10%);
      --bot: hsl(var(--hue) 18% 19%);
      --flag-bg: #3a2f10;
      --flag-ink: #ffd98a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: hsl(var(--hue) 22% 9%);
    --panel: hsl(var(--hue) 20% 13%);
    --ink: hsl(var(--hue) 20% 92%);
    --muted: hsl(var(--hue) 10% 66%);
    --line: hsl(var(--hue) 15% 24%);
    --accent: hsl(var(--hue) 60% 62%);
    --accent-ink: hsl(var(--hue) 40% 10%);
    --bot: hsl(var(--hue) 18% 19%);
    --flag-bg: #3a2f10;
    --flag-ink: #ffd98a;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: inherit; font-size: 15px; line-height: 1.5;
    padding-inline: 16px; padding-block: 16px; box-sizing: border-box;
    display: flex; justify-content: center;
  }
  .app {
    width: 100%; max-width: 440px; height: 100%; max-height: 760px;
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  }
  .flag {
    background: var(--flag-bg); color: var(--flag-ink);
    font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    padding: 8px 14px; text-align: center;
  }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; flex: none;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-weight: 700;
  }
  header h1 { font-size: 16px; margin: 0; text-wrap: balance; }
  header a { font-size: 13px; color: var(--muted); text-decoration: none; }
  header a:hover { text-decoration: underline; }
  .log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .me { background: var(--accent); color: var(--accent-ink); align-self: flex-end; border-bottom-right-radius: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; }
  .chips button {
    font: inherit; font-size: 13px; cursor: pointer;
    background: transparent; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 999px; padding: 5px 11px;
  }
  .chips button:hover { background: var(--bot); }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  input {
    flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
  }
  form button {
    font: inherit; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 0 16px;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note { font-size: 12px; color: var(--muted); text-align: center; padding: 0 16px 12px; margin: 0; }
</style>

</head>
<body>
<div class="app">
  <div class="flag">EXAMPLE · demo chatbot, not official</div>
  <header>
    <div class="avatar" id="avatar"></div>
    <div>
      <h1 id="name"></h1>
      <a id="site" target="_blank" rel="noopener"></a>
    </div>
  </header>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form id="form">
    <input id="q" autocomplete="off" placeholder="Type a question…" aria-label="Your question">
    <button type="submit">Send</button>
  </form>
  <p class="note">Keyword-based example built from public info on the company's website.</p>
</div>

<script>
const DEMO = {"name":"Huone Escapes","site":"https://huoneescapes.fi/en","hue":280,"intro":"Hi! I'm the Huone Escapes assistant (example). Ask me about our two escape rooms in Tapiola, Espoo: prices, group size, booking, gift cards or team building.","chips":["What rooms do you have?","How much does it cost?","How many players?","Where are you located?","Do you sell gift cards?","Team building for companies?"],"kb":[[[" gift"," voucher"," lahjakortti"],"Gift cards can be bought from our online shop with a debit or credit card (via Stripe) or MobilePay. You get a receipt and a link by email, where you can personalise the card with text and a picture. Each gift card is valid for 6 months from the date of purchase."],[[" team"," company"," companies"," corporate"," colleagues"," christmas"," business"],"Our two escape rooms fit about 16 players at the same time, split into two groups of 2-8 players. Games last up to one hour (reserve 1.5 hours in total) and can be played in Finnish or English. For bookings outside the regular calendar a minimum charge applies: 8 players or 280 euros. Businesses can pay by invoice (10 € invoicing fee). Ask us at info@huoneescapes.fi."],[[" student"," discount"," cheaper"],"Students get 10 € off per student (up to 33% depending on group size) on weekdays until 6:30 PM with a valid student ID. It can't be combined with other offers or gift cards."],[[" pay"," payment"," card"," cash"," mobilepay"," invoice"],"We accept debit and credit cards (Visa, Mastercard), MobilePay, Huone gift vouchers and company invoicing (10 € fee). We do not accept cash."],[[" price"," prices"," cost"," much"," euro"," fee"],"Prices depend on group size (VAT 13.5% included): 2 players 115 €, 3 players 135 €, 4 players 155 €, 5 players 175 €, 6 players 195 €, 7 players 210 €, 8 players 240 €. A public game costs 35 € per player."],[[" cancel"," cancellation"," change"," modify"," reschedule"],"You can modify your booking up to 24 hours before the game via the link in your confirmation or by emailing info@huoneescapes.fi. A single game must be cancelled at least 24 hours in advance (multiple games: one week). Late cancellations cost 100 € per room."],[[" today"," same day"," walk in"," without reservation"," whatsapp"],"For same-day game times, ask us on WhatsApp: 041 328 8040."],[[" book"," booking"," reserve"," reservation"],"You can book online on our website: huoneescapes.fi/en/book-an-escape-game. For same-day or weekend bookings you can also message us on WhatsApp at 041 328 8040."],[[" alone"," solo"," players"," people"," group"," how many"," size"],"We recommend groups of 2-8 players; a room fits up to 8. With two rooms, up to 16 people can play at the same time. Solo play is possible, but costs at least the price of two players."],[[" age"," kids"," children"," child"," old"],"There is no minimum or maximum age. Players under 15 need adult supervision. Public games are for ages 18+."],[[" scary"," horror"," dark"," afraid"],"Our games have no jump scares or horror elements. The lighting is mostly soft, with only brief dark moments."],[[" language"," english"," finnish"],"All our games can be played in both Finnish and English."],[[" wheelchair"," accessible"," accessibility"," toilet"],"In both games there's no need to crawl or reach, but there are some thresholds and tight spaces. We have two toilets, one of which is accessible."],[[" difficult"," difficulty"," hard"," beginner"," hint"],"Both rooms suit beginners and experienced players, and hints are unlimited. Difficulty: Captivating Exhibition 3.5/5, Waiting for Ville 4/5."],[[" ville"," 80s"," 1980"],"Waiting for Ville (2-8 players, 60 min, difficulty 4/5): you're invited to schoolmate Ville's house for a role-playing evening, but he calls from a pay phone to say he's late and gives you a task. Set in a 1980s teenager's bedroom with a Commodore 64, band posters and a tabletop RPG setup. No scary elements."],[[" exhibition"," art"," gallery"],"Captivating Exhibition (2-8 players, 60 min, difficulty 3.5/5): an art exhibition in the Boing pop-up gallery with textile art, photographs, paintings and interactive installations by Espoo-born artist Ansa Vaara. Great for creative thinkers."],[[" room"," rooms"," game"," games"," escape"],"We have two escape rooms, both 60 minutes for 2-8 players, designed and built in-house: Captivating Exhibition (art-themed, difficulty 3.5/5) and Waiting for Ville (1980s role-playing theme, difficulty 4/5). Every group has its own game master."],[[" park"," parking"," car"],"We have two reserved customer parking spots right next to our entrance. There are also several parking garages in Tapiola center, a five-minute walk away."],[[" where"," address"," location"," located"," metro"," bus"," find"," tapiola"],"Huone Escapes is at Revontulentie 8, 02100 Espoo, in Tapiola center next to Espoo Theatre. It's about a 5-minute walk from Tapiola metro station (follow the signs to Espoo Theatre). The Tuuliniitty bus stop is even closer."],[[" contact"," email"," phone"," call"],"Email us at info@huoneescapes.fi or message us on WhatsApp at 041 328 8040."]],"contact":"info@huoneescapes.fi"};

document.documentElement.style.setProperty("--hue", DEMO.hue ?? 200);
document.getElementById("name").textContent = DEMO.name;
document.getElementById("avatar").textContent = (DEMO.name || "?").trim().charAt(0).toUpperCase();
const siteLink = document.getElementById("site");
siteLink.href = DEMO.site;
siteLink.textContent = DEMO.site.replace(/^https?:\/\//, "").replace(/\/$/, "");

const log = document.getElementById("log");
function say(text, who) {
  const el = document.createElement("div");
  el.className = "msg " + who;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

function answer(question) {
  const text = " " + question.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ") + " ";
  for (const [keys, reply] of DEMO.kb) {
    if (keys.some(k => text.includes(k.toLowerCase()))) return reply;
  }
  return "I don't have that answer in this example. You can contact the team directly: " + DEMO.contact;
}

function ask(question) {
  question = question.trim();
  if (!question) return;
  say(question, "me");
  setTimeout(() => say(answer(question), "bot"), 350);
}

const chips = document.getElementById("chips");
for (const c of DEMO.chips) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = c;
  b.addEventListener("click", () => ask(c));
  chips.appendChild(b);
}

document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const q = document.getElementById("q");
  ask(q.value);
  q.value = "";
});

say(DEMO.intro, "bot");
</script>
</body>
</html>
