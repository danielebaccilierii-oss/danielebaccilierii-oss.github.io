<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>Eläinklinikka Karvakamut Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
  :root {
    --hue: 200;
    --bg: hsl(var(--hue) 25% 96%);
    --panel: #ffffff;
    --ink: hsl(var(--hue) 30% 12%);
    --muted: hsl(var(--hue) 12% 42%);
    --line: hsl(var(--hue) 18% 88%);
    --accent: hsl(var(--hue) 62% 38%);
    --accent-ink: #ffffff;
    --bot: hsl(var(--hue) 30% 94%);
    --flag-bg: #fff4d6;
    --flag-ink: #6b4a00;
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: hsl(var(--hue) 22% 9%);
      --panel: hsl(var(--hue) 20% 13%);
      --ink: hsl(var(--hue) 20% 92%);
      --muted: hsl(var(--hue) 10% 66%);
      --line: hsl(var(--hue) 15% 24%);
      --accent: hsl(var(--hue) 60% 62%);
      --accent-ink: hsl(var(--hue) 40% 10%);
      --bot: hsl(var(--hue) 18% 19%);
      --flag-bg: #3a2f10;
      --flag-ink: #ffd98a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: hsl(var(--hue) 22% 9%);
    --panel: hsl(var(--hue) 20% 13%);
    --ink: hsl(var(--hue) 20% 92%);
    --muted: hsl(var(--hue) 10% 66%);
    --line: hsl(var(--hue) 15% 24%);
    --accent: hsl(var(--hue) 60% 62%);
    --accent-ink: hsl(var(--hue) 40% 10%);
    --bot: hsl(var(--hue) 18% 19%);
    --flag-bg: #3a2f10;
    --flag-ink: #ffd98a;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: inherit; font-size: 15px; line-height: 1.5;
    padding-inline: 16px; padding-block: 16px; box-sizing: border-box;
    display: flex; justify-content: center;
  }
  .app {
    width: 100%; max-width: 440px; height: 100%; max-height: 760px;
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  }
  .flag {
    background: var(--flag-bg); color: var(--flag-ink);
    font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    padding: 8px 14px; text-align: center;
  }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; flex: none;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-weight: 700;
  }
  header h1 { font-size: 16px; margin: 0; text-wrap: balance; }
  header a { font-size: 13px; color: var(--muted); text-decoration: none; }
  header a:hover { text-decoration: underline; }
  .log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .me { background: var(--accent); color: var(--accent-ink); align-self: flex-end; border-bottom-right-radius: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; }
  .chips button {
    font: inherit; font-size: 13px; cursor: pointer;
    background: transparent; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 999px; padding: 5px 11px;
  }
  .chips button:hover { background: var(--bot); }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  input {
    flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
  }
  form button {
    font: inherit; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 0 16px;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note { font-size: 12px; color: var(--muted); text-align: center; padding: 0 16px 12px; margin: 0; }
</style>

</head>
<body>
<div class="app">
  <div class="flag">EXAMPLE · demo chatbot, not official</div>
  <header>
    <div class="avatar" id="avatar"></div>
    <div>
      <h1 id="name"></h1>
      <a id="site" target="_blank" rel="noopener"></a>
    </div>
  </header>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form id="form">
    <input id="q" autocomplete="off" placeholder="Type a question…" aria-label="Your question">
    <button type="submit">Send</button>
  </form>
  <p class="note">Keyword-based example built from public info on the company's website.</p>
</div>

<script>
const DEMO = {"name":"Eläinklinikka Karvakamut","site":"https://www.karvakamut.fi","hue":30,"intro":"Hi! I'm the Eläinklinikka Karvakamut assistant (example). Ask me about our opening hours, how to book, prices, payment and insurance, or how to prepare for a visit. For any health concern about your pet, please call the clinic.","chips":["What are your opening hours?","How do I book an appointment?","Where are you and where can I park?","How much does a basic visit cost?","Which payment methods do you accept?","What should I bring to a visit?"],"kb":[[[" hours"," open"," opening"," when"," closed"],"We are open Monday to Friday, 9:00–19:00."],[[" book"," booking"," appointment"," reserve"," reservation"," schedule"],"Appointments are booked by phone during opening hours (Mon–Fri 9–19): 09 2728 100."],[[" where"," address"," location"," located"," park"," parking"," find you"," hakunila"],"We are in the Hakunila shopping centre, Laukkarinne 4, 01200 Vantaa. Parking is at Hakunilantie 48."],[[" price"," prices"," cost"," how much"," fee"," basic visit"],"Some prices from our price list (visit fee and VAT included): basic visit from 67.30€, nurse visit (e.g. nail trimming) 20€, vaccinations from 70€, pregnancy ultrasound 81€, official hip screening from 185€. For anything not listed, call 09 2728 100 or email karvakamut@karvakamut.fi. Prices may change."],[[" neuter"," neutering"," castration"," castrate"," spay"," spaying"," sterilization"," sterilisation"],"Price list: male cat castration 106€, female cat sterilisation 190€, male dog castration from 270€, female dog sterilisation from 476€ (visit fee and VAT included)."],[[" teeth"," tooth"," dental"," tartar"],"Tartar removal: cat from 122€, dog 147–250€ (visit fee and VAT included)."],[[" pay"," payment"," card"," cash"," instalment"," installment"," insurance"," agria"," lahitapiola"," lähitapiola"],"You can pay by cash, common payment cards, or the Karvakamut instalment payment (subject to a credit decision). Direct billing is available with LähiTapiola and Agria; for LähiTapiola, please bring your pet's insurance number."],[[" bring"," prepare"," before"," visit"," certificate"," passport"," sample"," fasting"," fast"],"Please bring your pet's vaccination certificate or passport. If a blood test or sedation is likely, the clinic asks for 12 hours of fasting before the visit (water normally allowed unless told otherwise when booking). If the issue involves urinating or drinking, a fresh urine sample is helpful. Ideally the pet is brought in by someone who knows its behaviour and symptoms. Details are confirmed when you book."],[[" vaccine"," vaccination"," vaccinations"," booster"," reminder"],"Vaccinations start from 70€. We keep vaccination records in our system and send invitations when booster vaccinations are due. Please call 09 2728 100 to book."],[[" vet"," vets"," staff"," team"," doctor"," nurse"," swedish"," svenska"],"Our team: veterinarians Pia Carpelan, Heli Käck and Terhi Tuomi, and clinic veterinary nurses Heli Haikonen and Martin Mustonen. Pia Carpelan also serves customers in Swedish."],[[" emergency"," urgent"," sick"," symptom"," symptoms"," vomit"," ill"],"I can't give medical advice. Please call the clinic on 09 2728 100 during opening hours (Mon–Fri 9–19)."],[[" phone"," call"," contact"," email"," reach"],"Call us on 09 2728 100 or email karvakamut@karvakamut.fi."]],"contact":"karvakamut@karvakamut.fi / 09 2728 100"};

document.documentElement.style.setProperty("--hue", DEMO.hue ?? 200);
document.getElementById("name").textContent = DEMO.name;
document.getElementById("avatar").textContent = (DEMO.name || "?").trim().charAt(0).toUpperCase();
const siteLink = document.getElementById("site");
siteLink.href = DEMO.site;
siteLink.textContent = DEMO.site.replace(/^https?:\/\//, "").replace(/\/$/, "");

const log = document.getElementById("log");
function say(text, who) {
  const el = document.createElement("div");
  el.className = "msg " + who;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

function answer(question) {
  const text = " " + question.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ") + " ";
  for (const [keys, reply] of DEMO.kb) {
    if (keys.some(k => text.includes(k.toLowerCase()))) return reply;
  }
  return "I don't have that answer in this example. You can contact the team directly: " + DEMO.contact;
}

function ask(question) {
  question = question.trim();
  if (!question) return;
  say(question, "me");
  setTimeout(() => say(answer(question), "bot"), 350);
}

const chips = document.getElementById("chips");
for (const c of DEMO.chips) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = c;
  b.addEventListener("click", () => ask(c));
  chips.appendChild(b);
}

document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const q = document.getElementById("q");
  ask(q.value);
  q.value = "";
});

say(DEMO.intro, "bot");
</script>
</body>
</html>
