<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>Keravan Autokoulu Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
  :root {
    --hue: 200;
    --bg: hsl(var(--hue) 25% 96%);
    --panel: #ffffff;
    --ink: hsl(var(--hue) 30% 12%);
    --muted: hsl(var(--hue) 12% 42%);
    --line: hsl(var(--hue) 18% 88%);
    --accent: hsl(var(--hue) 62% 38%);
    --accent-ink: #ffffff;
    --bot: hsl(var(--hue) 30% 94%);
    --flag-bg: #fff4d6;
    --flag-ink: #6b4a00;
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: hsl(var(--hue) 22% 9%);
      --panel: hsl(var(--hue) 20% 13%);
      --ink: hsl(var(--hue) 20% 92%);
      --muted: hsl(var(--hue) 10% 66%);
      --line: hsl(var(--hue) 15% 24%);
      --accent: hsl(var(--hue) 60% 62%);
      --accent-ink: hsl(var(--hue) 40% 10%);
      --bot: hsl(var(--hue) 18% 19%);
      --flag-bg: #3a2f10;
      --flag-ink: #ffd98a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: hsl(var(--hue) 22% 9%);
    --panel: hsl(var(--hue) 20% 13%);
    --ink: hsl(var(--hue) 20% 92%);
    --muted: hsl(var(--hue) 10% 66%);
    --line: hsl(var(--hue) 15% 24%);
    --accent: hsl(var(--hue) 60% 62%);
    --accent-ink: hsl(var(--hue) 40% 10%);
    --bot: hsl(var(--hue) 18% 19%);
    --flag-bg: #3a2f10;
    --flag-ink: #ffd98a;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: inherit; font-size: 15px; line-height: 1.5;
    padding-inline: 16px; padding-block: 16px; box-sizing: border-box;
    display: flex; justify-content: center;
  }
  .app {
    width: 100%; max-width: 440px; height: 100%; max-height: 760px;
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  }
  .flag {
    background: var(--flag-bg); color: var(--flag-ink);
    font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    padding: 8px 14px; text-align: center;
  }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; flex: none;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-weight: 700;
  }
  header h1 { font-size: 16px; margin: 0; text-wrap: balance; }
  header a { font-size: 13px; color: var(--muted); text-decoration: none; }
  header a:hover { text-decoration: underline; }
  .log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .me { background: var(--accent); color: var(--accent-ink); align-self: flex-end; border-bottom-right-radius: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; }
  .chips button {
    font: inherit; font-size: 13px; cursor: pointer;
    background: transparent; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 999px; padding: 5px 11px;
  }
  .chips button:hover { background: var(--bot); }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  input {
    flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
  }
  form button {
    font: inherit; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 0 16px;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note { font-size: 12px; color: var(--muted); text-align: center; padding: 0 16px 12px; margin: 0; }
</style>

</head>
<body>
<div class="app">
  <div class="flag">EXAMPLE · demo chatbot, not official</div>
  <header>
    <div class="avatar" id="avatar"></div>
    <div>
      <h1 id="name"></h1>
      <a id="site" target="_blank" rel="noopener"></a>
    </div>
  </header>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form id="form">
    <input id="q" autocomplete="off" placeholder="Type a question…" aria-label="Your question">
    <button type="submit">Send</button>
  </form>
  <p class="note">Keyword-based example built from public info on the company's website.</p>
</div>

<script>
const DEMO = {"name": "Keravan Autokoulu", "site": "https://www.keravanautokoulu.fi", "hue": 210, "intro": "Hi! I'm the Keravan Autokoulu assistant. Ask me about driving licence courses, prices, theory lessons, payment options or office hours.", "chips": ["How much is a car (B) licence?", "What are your office hours?", "Can I do theory lessons online?", "Do you have motorcycle courses?", "Can I pay in instalments?", "Where are you located?"], "kb": [[[" b licence", " b course", " b-course", " car licence", " car course", " driving licence", " car "], "Car (B) courses include 11 theory lessons and 15 driving lessons (risk-recognition training included), mixing simulator and real-car lessons. Prices: B minimum (7.5 sim / 7.5 car) 1075 EUR, B 5/10 1289 EUR, B basic 1472 EUR, B recommended 1532 EUR, B premium (18 driving lessons) 1759 EUR. Extra driving lesson from 82 EUR. Official authority fees are separate."], [[" price", " prices", " cost", " how much", " fee", " fees"], "Course prices from: car (B) from 1075 EUR, motorcycle (A1/A2/A) 559 EUR, moped AM120 from 219 EUR, moped car AM121 from 299 EUR, C1 truck from 509 EUR, RTK from 289 EUR, EAS theory from 51 EUR. Authority fees are separate. Full price list: https://www.keravanautokoulu.fi/hinnasto-1"], [[" simulator"], "Driving lessons normally start with one simulator lesson, then one lesson in a real car. If you choose the B recommended or premium course and don't like the simulator lesson, it is free of charge."], [[" automatic"], "Yes, you can train and take the B course with an automatic car. If the driving test is also done in an automatic, your licence will be limited to automatic cars; you can upgrade later with a new driving test."], [[" theory", " online", " eas", " lessons online", " remote", " video"], "Theory can be done online: e-learning lessons Mon-Fri 08:00-22:00 and Sat 08:00-16:00, or remote video lessons every day 07:00-23:00. E-learning is available in Finnish, Swedish or English. The first-licence EAS theory course starts from 51 EUR."], [[" english", " swedish", " language"], "E-learning theory lessons are available in Finnish, Swedish or English."], [[" motorcycle", " motorbike", " a1", " a2", " mp"], "Motorcycle courses A1 (age 16), A2 (age 18) and A (age 24): 4 EAS lessons, 5 driving lessons and use of the bike in the tests, 559 EUR + authority fees. Extra lesson 90 EUR. Upgrade courses A1>A2 and A2>A: 485 EUR + fees, 15% off if you ride your own bike. Our instructors ride their own motorcycle during lessons."], [[" moped", " am120", " am121", " mopo", " moped car", " mopoauto"], "Moped AM120: minimum course (4 theory + 1 driving lesson + handling test) 219 EUR, recommended (3 driving lessons) 359 EUR, guarantee course (5 driving lessons) 499 EUR. Moped car AM121: from 299 EUR, recommended 468 EUR. Authority fees separate."], [[" truck", " c1", " lorry"], "We offer C1 truck licence courses from 509 EUR + authority fees. Details: https://www.keravanautokoulu.fi/c1-ja-c-kurssit"], [[" rtk", " risk"], "RTK (risk-recognition) courses start from 289 EUR. RTK and EAS are included in all our car (B) courses."], [[" hours", " open", " opening", " office"], "Office hours: Monday 12:00-17:00 and Wednesday 12:00-17:00. Closed Tue, Thu-Sun. Also open by appointment. Outside office hours we reply at the latest on the next office day."], [[" where", " address", " location", " located", " find you"], "Keravan Autokoulu, Kauppakaari 11, entrance from Nikkarinkuja at street level, 04200 Kerava."], [[" instalment", " installment", " svea", " finance", " financing", " pay later"], "With SVEA Bank financing you can pay in 3-36 months (credit 50-2200 EUR, minimum age 21, requires valid credit record). No collateral or guarantors."], [[" pay", " payment", " mobilepay", " card", " cash"], "You can pay online at registration (online banking, cards, Pivo and MobilePay), by invoice, with SVEA instalments, or in cash at our office. All payments must be completed before the driving test."], [[" register", " sign up", " enrol", " enroll", " book", " start"], "You can see upcoming course start dates and register online via our WebAuto service: https://kuljettajaopetus.fi/keravanautokoulu - or come and register at the office during office hours."], [[" instructor", " teacher", " juha", " ari", " staff"], "All our staff are trained driving instructors. Juha Kuvaja (CEO, classes AM, A, B, C) and Ari Tissari (AM120, A, B). You can tell us which instructor you'd prefer for your driving lessons."], [[" about", " since", " history", " chain"], "Keravan Autokoulu has offered driver training since 1986. We are a genuinely local Kerava driving school, not part of any chain."], [[" contact", " phone", " email", " call"], "Phone 050 545 7514 (please no text messages) or email toimisto@keravanautokoulu.fi."]], "contact": "toimisto@keravanautokoulu.fi"};

document.documentElement.style.setProperty("--hue", DEMO.hue ?? 200);
document.getElementById("name").textContent = DEMO.name;
document.getElementById("avatar").textContent = (DEMO.name || "?").trim().charAt(0).toUpperCase();
const siteLink = document.getElementById("site");
siteLink.href = DEMO.site;
siteLink.textContent = DEMO.site.replace(/^https?:\/\//, "").replace(/\/$/, "");

const log = document.getElementById("log");
function say(text, who) {
  const el = document.createElement("div");
  el.className = "msg " + who;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

function answer(question) {
  const text = " " + question.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ") + " ";
  for (const [keys, reply] of DEMO.kb) {
    if (keys.some(k => text.includes(k.toLowerCase()))) return reply;
  }
  return "I don't have that answer in this example. You can contact the team directly: " + DEMO.contact;
}

function ask(question) {
  question = question.trim();
  if (!question) return;
  say(question, "me");
  setTimeout(() => say(answer(question), "bot"), 350);
}

const chips = document.getElementById("chips");
for (const c of DEMO.chips) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = c;
  b.addEventListener("click", () => ask(c));
  chips.appendChild(b);
}

document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const q = document.getElementById("q");
  ask(q.value);
  q.value = "";
});

say(DEMO.intro, "bot");
</script>
</body>
</html>
