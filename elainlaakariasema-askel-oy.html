<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>Eläinlääkäriasema Askel Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
  :root {
    --hue: 200;
    --bg: hsl(var(--hue) 25% 96%);
    --panel: #ffffff;
    --ink: hsl(var(--hue) 30% 12%);
    --muted: hsl(var(--hue) 12% 42%);
    --line: hsl(var(--hue) 18% 88%);
    --accent: hsl(var(--hue) 62% 38%);
    --accent-ink: #ffffff;
    --bot: hsl(var(--hue) 30% 94%);
    --flag-bg: #fff4d6;
    --flag-ink: #6b4a00;
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: hsl(var(--hue) 22% 9%);
      --panel: hsl(var(--hue) 20% 13%);
      --ink: hsl(var(--hue) 20% 92%);
      --muted: hsl(var(--hue) 10% 66%);
      --line: hsl(var(--hue) 15% 24%);
      --accent: hsl(var(--hue) 60% 62%);
      --accent-ink: hsl(var(--hue) 40% 10%);
      --bot: hsl(var(--hue) 18% 19%);
      --flag-bg: #3a2f10;
      --flag-ink: #ffd98a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: hsl(var(--hue) 22% 9%);
    --panel: hsl(var(--hue) 20% 13%);
    --ink: hsl(var(--hue) 20% 92%);
    --muted: hsl(var(--hue) 10% 66%);
    --line: hsl(var(--hue) 15% 24%);
    --accent: hsl(var(--hue) 60% 62%);
    --accent-ink: hsl(var(--hue) 40% 10%);
    --bot: hsl(var(--hue) 18% 19%);
    --flag-bg: #3a2f10;
    --flag-ink: #ffd98a;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: inherit; font-size: 15px; line-height: 1.5;
    padding-inline: 16px; padding-block: 16px; box-sizing: border-box;
    display: flex; justify-content: center;
  }
  .app {
    width: 100%; max-width: 440px; height: 100%; max-height: 760px;
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  }
  .flag {
    background: var(--flag-bg); color: var(--flag-ink);
    font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    padding: 8px 14px; text-align: center;
  }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; flex: none;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-weight: 700;
  }
  header h1 { font-size: 16px; margin: 0; text-wrap: balance; }
  header a { font-size: 13px; color: var(--muted); text-decoration: none; }
  header a:hover { text-decoration: underline; }
  .log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .me { background: var(--accent); color: var(--accent-ink); align-self: flex-end; border-bottom-right-radius: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; }
  .chips button {
    font: inherit; font-size: 13px; cursor: pointer;
    background: transparent; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 999px; padding: 5px 11px;
  }
  .chips button:hover { background: var(--bot); }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  input {
    flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
  }
  form button {
    font: inherit; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 0 16px;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note { font-size: 12px; color: var(--muted); text-align: center; padding: 0 16px 12px; margin: 0; }
</style>

</head>
<body>
<div class="app">
  <div class="flag">EXAMPLE · demo chatbot, not official</div>
  <header>
    <div class="avatar" id="avatar"></div>
    <div>
      <h1 id="name"></h1>
      <a id="site" target="_blank" rel="noopener"></a>
    </div>
  </header>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form id="form">
    <input id="q" autocomplete="off" placeholder="Type a question…" aria-label="Your question">
    <button type="submit">Send</button>
  </form>
  <p class="note">Keyword-based example built from public info on the company's website.</p>
</div>

<script>
const DEMO = {"name":"Eläinlääkäriasema Askel","site":"https://www.askel.pro","hue":160,"intro":"Hi! I'm the Eläinlääkäriasema Askel assistant (example). Ask me about our services, opening hours, booking, prices or location in Tuusula. For anything about your pet's health, please contact the clinic directly.","chips":["What are your opening hours?","How do I book an appointment?","Where are you located?","What services do you offer?","How much does a vaccination cost?","How can I pay?"],"kb":[[[" hours"," open"," opening"," saturday"," weekend"," when"],"We are open Monday to Friday 9:00–20:00. Saturdays by appointment."],[[" book"," booking"," appointment"," reserve"," reservation"," online"],"You can book an appointment online through our booking system (link on askel.pro) or by phone at 0400 236 254."],[[" where"," address"," location"," located"," find you"," tuusula"," sahankulma"],"You'll find us at Moukarinkuja 4 A3 (Sahankulma shopping centre), 04300 Tuusula."],[[" service"," services"," offer"," treat"," do you do"],"Our services include surgery, dental care and dental X-rays, pain assessment (also with a thermal camera), laboratory tests, vaccinations, X-ray and ultrasound examinations, senior health checks, PEVISA examinations for the Finnish Kennel Club, dog breeding packages, and neutering of cats, rabbits and dogs."],[[" vaccin"," vaccine"," vaccination"," rokotus"," herpes"],"Vaccination (cats and dogs): 58.60 € + vaccines; 41.40 € + vaccines when done together with another procedure or for the 3rd or further animal of the same owner on the same visit. Herpes vaccination 88.60 € (vaccine included). Prices include VAT 25.5%; a clinic fee is added."],[[" neuter"," neutering"," castration"," castrate"," spay"," spaying"," sterilisation"," sterilization"],"Neutering prices: dog spay 495–670 €, dog castration 275–410 € (inhalation anaesthesia); cat spay 345–385 € (inhalation anaesthesia), cat castration 127–157 € (intravenous anaesthesia). Prices include VAT 25.5%; a clinic fee is added. Rabbits can also be neutered – contact us for details."],[[" price"," prices"," cost"," how much"," fee"],"You can find our price list on askel.pro/hinnasto. Prices include VAT 25.5% and a clinic fee is added. For more detailed price information, please contact us at 0400 236 254 or info@askel.pro."],[[" pay"," payment"," card"," cash"," invoice"," resurs"],"You can pay by cash, card or invoice. Invoicing requires an Askel account, opened through Resurs Bank."],[[" cancel"," cancellation"," late"],"Appointments can be cancelled free of charge the previous day. Late cancellations are charged 20.25 € (up to 30 min) or 40.50 € (up to 60 min)."],[[" evening"," after hours"," outside"," holiday"," sunday"," surcharge"],"Outside opening hours a surcharge applies: +30% on weekdays and +60% on Sundays and public holidays. Please call 0400 236 254."],[[" dental"," dentist"," teeth"," tooth"],"We offer dental care, including dental X-rays and tooth extractions. Book online or call 0400 236 254."],[[" pevisa"," kennel"," breeding"," progesterone"," heat"],"We do PEVISA examinations for the Finnish Kennel Club (official X-rays, knee examinations and heart auscultation), progesterone testing for female dogs' heat cycles and dog breeding packages."],[[" senior"," old"," elderly"],"We offer senior health checks, and our anaesthesia monitoring also supports surgery for elderly animals."],[[" vet"," vets"," staff"," team"," doctor"," veterinarian"],"Our veterinarians are Mari Tienhaara, Teea Saaristo, Erja Knuth, Anne Ropponen, Krista Mäkeläinen and Katri Ojalehto, supported by our veterinary nursing team. See askel.pro/henkilokunta for their areas of interest."],[[" contact"," phone"," call"," email"," mail"],"Phone and booking: 0400 236 254. Email: info@askel.pro."],[[" sick"," ill"," symptom"," emergency"," hurt"," injured"," medicine"," vomit"],"I can't give medical advice. If your pet is sick or injured, please call the clinic at 0400 236 254."]],"contact":"info@askel.pro"};

document.documentElement.style.setProperty("--hue", DEMO.hue ?? 200);
document.getElementById("name").textContent = DEMO.name;
document.getElementById("avatar").textContent = (DEMO.name || "?").trim().charAt(0).toUpperCase();
const siteLink = document.getElementById("site");
siteLink.href = DEMO.site;
siteLink.textContent = DEMO.site.replace(/^https?:\/\//, "").replace(/\/$/, "");

const log = document.getElementById("log");
function say(text, who) {
  const el = document.createElement("div");
  el.className = "msg " + who;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

function answer(question) {
  const text = " " + question.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ") + " ";
  for (const [keys, reply] of DEMO.kb) {
    if (keys.some(k => text.includes(k.toLowerCase()))) return reply;
  }
  return "I don't have that answer in this example. You can contact the team directly: " + DEMO.contact;
}

function ask(question) {
  question = question.trim();
  if (!question) return;
  say(question, "me");
  setTimeout(() => say(answer(question), "bot"), 350);
}

const chips = document.getElementById("chips");
for (const c of DEMO.chips) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = c;
  b.addEventListener("click", () => ask(c));
  chips.appendChild(b);
}

document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const q = document.getElementById("q");
  ask(q.value);
  q.value = "";
});

say(DEMO.intro, "bot");
</script>
</body>
</html>
