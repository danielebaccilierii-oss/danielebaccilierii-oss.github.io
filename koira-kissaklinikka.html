<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Koira-Kissaklinikka Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
  :root {
    --hue: 200;
    --bg: hsl(var(--hue) 25% 96%);
    --panel: #ffffff;
    --ink: hsl(var(--hue) 30% 12%);
    --muted: hsl(var(--hue) 12% 42%);
    --line: hsl(var(--hue) 18% 88%);
    --accent: hsl(var(--hue) 62% 38%);
    --accent-ink: #ffffff;
    --bot: hsl(var(--hue) 30% 94%);
    --flag-bg: #fff4d6;
    --flag-ink: #6b4a00;
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: hsl(var(--hue) 22% 9%);
      --panel: hsl(var(--hue) 20% 13%);
      --ink: hsl(var(--hue) 20% 92%);
      --muted: hsl(var(--hue) 10% 66%);
      --line: hsl(var(--hue) 15% 24%);
      --accent: hsl(var(--hue) 60% 62%);
      --accent-ink: hsl(var(--hue) 40% 10%);
      --bot: hsl(var(--hue) 18% 19%);
      --flag-bg: #3a2f10;
      --flag-ink: #ffd98a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: hsl(var(--hue) 22% 9%);
    --panel: hsl(var(--hue) 20% 13%);
    --ink: hsl(var(--hue) 20% 92%);
    --muted: hsl(var(--hue) 10% 66%);
    --line: hsl(var(--hue) 15% 24%);
    --accent: hsl(var(--hue) 60% 62%);
    --accent-ink: hsl(var(--hue) 40% 10%);
    --bot: hsl(var(--hue) 18% 19%);
    --flag-bg: #3a2f10;
    --flag-ink: #ffd98a;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: inherit; font-size: 15px; line-height: 1.5;
    padding-inline: 16px; padding-block: 16px; box-sizing: border-box;
    display: flex; justify-content: center;
  }
  .app {
    width: 100%; max-width: 440px; height: 100%; max-height: 760px;
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  }
  .flag {
    background: var(--flag-bg); color: var(--flag-ink);
    font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    padding: 8px 14px; text-align: center;
  }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; flex: none;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-weight: 700;
  }
  header h1 { font-size: 16px; margin: 0; text-wrap: balance; }
  header a { font-size: 13px; color: var(--muted); text-decoration: none; }
  header a:hover { text-decoration: underline; }
  .log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .me { background: var(--accent); color: var(--accent-ink); align-self: flex-end; border-bottom-right-radius: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; }
  .chips button {
    font: inherit; font-size: 13px; cursor: pointer;
    background: transparent; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 999px; padding: 5px 11px;
  }
  .chips button:hover { background: var(--bot); }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  input {
    flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
  }
  form button {
    font: inherit; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 0 16px;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note { font-size: 12px; color: var(--muted); text-align: center; padding: 0 16px 12px; margin: 0; }
</style>

<div class="app">
  <div class="flag">EXAMPLE · demo chatbot, not official</div>
  <header>
    <div class="avatar" id="avatar"></div>
    <div>
      <h1 id="name"></h1>
      <a id="site" target="_blank" rel="noopener"></a>
    </div>
  </header>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form id="form">
    <input id="q" autocomplete="off" placeholder="Type a question…" aria-label="Your question">
    <button type="submit">Send</button>
  </form>
  <p class="note">Keyword-based example built from public info on the company's website.</p>
</div>

<script>
const DEMO = {"name":"Koira-Kissaklinikka","site":"https://koirakissaklinikka.fi/","hue":165,"intro":"Hi! This is an example assistant for Koira-Kissaklinikka, a veterinary clinic for dogs, cats and small animals in Metsämäki, Turku. Ask me about opening hours, booking, prices or services.","chips":["What are your opening hours?","How do I book an appointment?","Where is the clinic?","How much is a dog vaccination?","Which animals do you treat?","Do you bill insurance directly?"],"kb":[[[" vaccin"," rokot"],"Puppy and routine vaccinations are available. Sample prices from our price list: dog 3-vaccine 79.90 €, dog 4-vaccine 81.00 €, cat 3-vaccine 81.90 €. Book by phone at 02 2761 999 or online 24/7."],[[" insur"," agria"," lahitapiola"," lähitapiola"," vakuut"],"We can bill animal insurance directly with Agria and LähiTapiola."],[[" pay"," instal"," resurs"," financ"," invoice"],"You can pay with Resurs financing: buy now and get the invoice next month, with up to 12 months interest-free. Direct insurance billing is available with Agria and LähiTapiola."],[[" cancel"," peru"],"Please cancel at least 24 hours in advance, by phone at 02 2761 999. For appointments not cancelled, we charge 50% of the booked procedure's price."],[[" microchip"," chip"," siru"],"Microchipping costs 84 €."],[[" spay"," neuter"," castrat"," steril"," price"," cost"," how much"," hinta"],"Sample prices from our price list: female dog spaying 791–1,095 € and male dog neutering 469.50–711 € (depending on weight), dog vaccination from 79.90 €, cat 3-vaccine 81.90 €, microchipping 84 €. The full price list is on our website."],[[" emergenc"," urgent"," päivystys"," paivystys"],"On Saturdays 9–17 we have emergency duty by appointment. Please book the time by phone at 02 2761 999."],[[" hour"," open"," close"," saturday"," sunday"," weekend"," aukiolo"],"Opening hours: Monday–Thursday 8–20, Friday 8–19, Saturday 9–17 (emergency duty by appointment)."],[[" book"," appointment"," reserv"," ajanvaraus"," aika "],"You can book by phone at 02 2761 999, or online 24/7 through our online booking (link on our website). Appointments are not booked by email."],[[" where"," address"," location"," find"," direction"," gps"," navigat"," turku"],"We are at Raviraitti 45 (Vanha Tampereentie 233), 20380 Turku (Metsämäki). If you use GPS, include \"Turku\" in the address. The navigator takes you slightly past the junction: turn into the Metsämäki depot (varikko) area."],[[" blood bank"," veripankki"," donor"," donat"],"Koira-Kissaklinikka has its own blood bank for animals. See the blood bank page on our website for details."],[[" physio"," rehab"," water therap"," laser"," massage"],"We offer physiotherapy and rehabilitation, including water therapy, laser therapy, and dog massage and stretching."],[[" ct "," x ray"," xray"," röntgen"," ultrasound"," imaging"," scan"," endoscop"],"Our imaging and diagnostics include CT scanning, X-ray, ultrasound, contrast studies and endoscopy."],[[" surgery"," surgical"," operation"," leikkaus"],"We perform over 700 surgeries on small animal patients every year, including sterilisations."],[[" animal"," dog"," cat"," rabbit"," rodent"," exotic"," pet"," koira"," kissa"],"We treat dogs, cats, and small animals and exotic pets such as rabbits and rodents."],[[" service"," dental"," teeth"," eye"," ear"," skin"," senior"," diet"," food"," travel"," lab"," blood test"],"Our services include senior check-ups, dental care, vaccinations, official eye examinations, ear and skin examinations, internal medicine and laboratory tests, surgery, imaging (CT, X-ray, ultrasound), physiotherapy, special diets, a blood bank and travel documents."],[[" vet"," staff"," team"," doctor"," who "],"Our team includes two owner-veterinarians and seven veterinarians, plus twelve support staff and a physiotherapist."],[[" email"," phone"," contact"," call"," number"],"Phone: 02 2761 999 (appointments and cancellations by phone). Email: vastaanotto@koirakissaklinikka.fi for matters other than appointments."]],"contact":"vastaanotto@koirakissaklinikka.fi or phone 02 2761 999"};

document.documentElement.style.setProperty("--hue", DEMO.hue ?? 200);
document.getElementById("name").textContent = DEMO.name;
document.getElementById("avatar").textContent = (DEMO.name || "?").trim().charAt(0).toUpperCase();
const siteLink = document.getElementById("site");
siteLink.href = DEMO.site;
siteLink.textContent = DEMO.site.replace(/^https?:\/\//, "").replace(/\/$/, "");

const log = document.getElementById("log");
function say(text, who) {
  const el = document.createElement("div");
  el.className = "msg " + who;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

function answer(question) {
  const text = " " + question.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ") + " ";
  for (const [keys, reply] of DEMO.kb) {
    if (keys.some(k => text.includes(k.toLowerCase()))) return reply;
  }
  return "I don't have that answer in this example. You can contact the team directly: " + DEMO.contact;
}

function ask(question) {
  question = question.trim();
  if (!question) return;
  say(question, "me");
  setTimeout(() => say(answer(question), "bot"), 350);
}

const chips = document.getElementById("chips");
for (const c of DEMO.chips) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = c;
  b.addEventListener("click", () => ask(c));
  chips.appendChild(b);
}

document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const q = document.getElementById("q");
  ask(q.value);
  q.value = "";
});

say(DEMO.intro, "bot");
</script>

</body>
</html>
