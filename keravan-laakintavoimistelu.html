<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>Keravan Lääkintävoimistelu Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
  :root {
    --hue: 200;
    --bg: hsl(var(--hue) 25% 96%);
    --panel: #ffffff;
    --ink: hsl(var(--hue) 30% 12%);
    --muted: hsl(var(--hue) 12% 42%);
    --line: hsl(var(--hue) 18% 88%);
    --accent: hsl(var(--hue) 62% 38%);
    --accent-ink: #ffffff;
    --bot: hsl(var(--hue) 30% 94%);
    --flag-bg: #fff4d6;
    --flag-ink: #6b4a00;
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: hsl(var(--hue) 22% 9%);
      --panel: hsl(var(--hue) 20% 13%);
      --ink: hsl(var(--hue) 20% 92%);
      --muted: hsl(var(--hue) 10% 66%);
      --line: hsl(var(--hue) 15% 24%);
      --accent: hsl(var(--hue) 60% 62%);
      --accent-ink: hsl(var(--hue) 40% 10%);
      --bot: hsl(var(--hue) 18% 19%);
      --flag-bg: #3a2f10;
      --flag-ink: #ffd98a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: hsl(var(--hue) 22% 9%);
    --panel: hsl(var(--hue) 20% 13%);
    --ink: hsl(var(--hue) 20% 92%);
    --muted: hsl(var(--hue) 10% 66%);
    --line: hsl(var(--hue) 15% 24%);
    --accent: hsl(var(--hue) 60% 62%);
    --accent-ink: hsl(var(--hue) 40% 10%);
    --bot: hsl(var(--hue) 18% 19%);
    --flag-bg: #3a2f10;
    --flag-ink: #ffd98a;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: inherit; font-size: 15px; line-height: 1.5;
    padding-inline: 16px; padding-block: 16px; box-sizing: border-box;
    display: flex; justify-content: center;
  }
  .app {
    width: 100%; max-width: 440px; height: 100%; max-height: 760px;
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  }
  .flag {
    background: var(--flag-bg); color: var(--flag-ink);
    font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    padding: 8px 14px; text-align: center;
  }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; flex: none;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-weight: 700;
  }
  header h1 { font-size: 16px; margin: 0; text-wrap: balance; }
  header a { font-size: 13px; color: var(--muted); text-decoration: none; }
  header a:hover { text-decoration: underline; }
  .log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .me { background: var(--accent); color: var(--accent-ink); align-self: flex-end; border-bottom-right-radius: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; }
  .chips button {
    font: inherit; font-size: 13px; cursor: pointer;
    background: transparent; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 999px; padding: 5px 11px;
  }
  .chips button:hover { background: var(--bot); }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  input {
    flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
  }
  form button {
    font: inherit; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 0 16px;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note { font-size: 12px; color: var(--muted); text-align: center; padding: 0 16px 12px; margin: 0; }
</style>

</head>
<body>
<div class="app">
  <div class="flag">EXAMPLE · demo chatbot, not official</div>
  <header>
    <div class="avatar" id="avatar"></div>
    <div>
      <h1 id="name"></h1>
      <a id="site" target="_blank" rel="noopener"></a>
    </div>
  </header>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form id="form">
    <input id="q" autocomplete="off" placeholder="Type a question…" aria-label="Your question">
    <button type="submit">Send</button>
  </form>
  <p class="note">Keyword-based example built from public info on the company's website.</p>
</div>

<script>
const DEMO = {"name": "Keravan Lääkintävoimistelu", "site": "https://keravanlaakintavoimistelu.fi/", "hue": 160, "intro": "Hi! I'm the Keravan Lääkintävoimistelu assistant (example). Ask me about our treatments, prices, booking, Kela reimbursement, opening hours or location. I can't give medical advice - for that, please contact our physiotherapists.", "chips": ["What treatments do you offer?", "How much is physiotherapy?", "How do I book?", "Do I need a referral?", "What are your opening hours?", "Where are you located?"], "kb": [[[" treatment", " service", " offer", " what do you"], "We offer physiotherapy, massage, lymphatic therapy, osteopathy, foot therapy, craniosacral therapy, acupuncture, pelvic floor physiotherapy, paediatric physiotherapy and osteopathy, plus device treatments such as Softlaser, LPG, Cryonic and X-CRYO cold therapy, Neurosonic, BEMER, Lympha Press, X-TONE and OxyPro hyperbaric oxygen. We also sell health products."], [[" physio", " fysio"], "Physiotherapy prices: 30 min 51 EUR, 45 min 66 EUR, 60 min 76 EUR, 75 min 92 EUR, 90 min 103 EUR. Kela reimburses 15 EUR per physiotherapy visit, up to 4 times per calendar year, and no referral is needed for that."], [[" price", " cost", " how much", " fee"], "Some examples: physiotherapy 60 min 76 EUR, massage 55 min 66 EUR, osteopathy 60 min 89 EUR, lymphatic therapy 60 min 89 EUR, foot therapy 40 min 64 EUR. There is a service fee of 10 EUR per calendar year and a 50% surcharge for home visits. Prices include Kanta and other official fees. Full price list: https://keravanlaakintavoimistelu.fi/hinnasto/"], [[" massage", " hieronta"], "Massage: 25 min 44 EUR, 40 min 56 EUR, 55 min 66 EUR, 85 min 94 EUR."], [[" osteopat"], "Osteopathy 60 min costs 89 EUR. According to our site, the treatment is gentle and suitable for all ages, including people planning a pregnancy or who are pregnant. We also offer osteopathy for children."], [[" foot", " podiat", " jalka"], "Foot therapy (incl. skin and nail care and a moisturising massage): 25 min 49 EUR, 40 min 64 EUR, 55 min 72 EUR. Our foot therapist also treats risk groups such as people with diabetes or rheumatism."], [[" lymph", " lymf", " compression", " stocking"], "Lymphatic therapy: 30 min 63 EUR, 45 min 75 EUR, 60 min 89 EUR, 90 min 115 EUR, 120 min 142 EUR. Measuring for compression stockings from 59.50 EUR (30 min). Machine lymph treatment (Lympha Press) 50 EUR once or 200 EUR for 5 sessions."], [[" book", " appointment", " reserv", " varaa"], "You can book online (https://www.nordhealth.fi/fi/yritys/keravan-laakintavoimistelu?tab=appointments) or by phone at (09) 242 9804. If you can't find a suitable time online, please call. You can also drop by our clinic. Note: missed appointments that are not cancelled are charged in full."], [[" cancel", " no-show", " no show"], "Appointments that are not cancelled are charged in full. To change a booking, please call (09) 242 9804."], [[" referral", " lähete", " lahete"], "You can get treatment with or without a referral. The Kela direct reimbursement for physiotherapy (15 EUR, up to 4 visits per calendar year) does not require a referral."], [[" kela", " reimburs", " insurance", " voucher", " payment commitment", " hus"], "We accept Kela, insurance companies, HUS specialist care, the Palse.fi portal, and service vouchers and payment commitments from the wellbeing services counties. We are also a Kela provider of demanding medical rehabilitation (individual physiotherapy and pool therapy). You can also check with your insurer whether you can pay first and claim the cost back afterwards."], [[" pay", " epassi", " edenred", " card"], "In addition to normal payment, we accept ePassi and Edenred."], [[" hours", " open", " when are you"], "We serve Mon-Thu 8-19, Fri 8-16, and Saturdays by agreement."], [[" where", " address", " locat", " parking", " wheelchair", " accessib"], "We are at Sibeliuksentie 19, 04200 Kerava. Free parking is right in front of the door, and the premises are accessible also by wheelchair."], [[" home visit", " at home", " house call", " koti"], "Yes, we also treat clients at home, in care homes, day care centres, schools and elsewhere in the client's everyday environment, e.g. in Kerava, Järvenpää, Tuusula, Sipoo, Vantaa, Helsinki and nearby areas. Home visits have a 50% surcharge; household tax deduction may apply to physiotherapy home visits."], [[" remote", " online therapy", " video", " etä"], "We offer remote rehabilitation via a secure video connection: we email you a link, and you only need a computer, smartphone or tablet."], [[" child", " kid", " baby", " lapsi", " lasten"], "We offer physiotherapy and osteopathy for children, and Kela rehabilitation for children and young people."], [[" language", " english", " swedish", " speak"], "Our team speaks Finnish and English; several team members also speak Swedish, and individual staff speak Persian, Italian or German."], [[" gift", " lahjakort"], "Gift cards are available for a chosen treatment or amount, valid for 6 months. Call us or visit the clinic; we can also send them by email or post."], [[" pain", " hurt", " injur", " symptom", " diagnos"], "I can't give medical advice. Please call (09) 242 9804 or email info@keravanlaakintavoimistelu.fi and our physiotherapists will help you find a suitable treatment."], [[" contact", " phone", " email", " call"], "Phone (09) 242 9804, email info@keravanlaakintavoimistelu.fi, address Sibeliuksentie 19, 04200 Kerava."]], "contact": "info@keravanlaakintavoimistelu.fi"};

document.documentElement.style.setProperty("--hue", DEMO.hue ?? 200);
document.getElementById("name").textContent = DEMO.name;
document.getElementById("avatar").textContent = (DEMO.name || "?").trim().charAt(0).toUpperCase();
const siteLink = document.getElementById("site");
siteLink.href = DEMO.site;
siteLink.textContent = DEMO.site.replace(/^https?:\/\//, "").replace(/\/$/, "");

const log = document.getElementById("log");
function say(text, who) {
  const el = document.createElement("div");
  el.className = "msg " + who;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

function answer(question) {
  const text = " " + question.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ") + " ";
  for (const [keys, reply] of DEMO.kb) {
    if (keys.some(k => text.includes(k.toLowerCase()))) return reply;
  }
  return "I don't have that answer in this example. You can contact the team directly: " + DEMO.contact;
}

function ask(question) {
  question = question.trim();
  if (!question) return;
  say(question, "me");
  setTimeout(() => say(answer(question), "bot"), 350);
}

const chips = document.getElementById("chips");
for (const c of DEMO.chips) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = c;
  b.addEventListener("click", () => ask(c));
  chips.appendChild(b);
}

document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const q = document.getElementById("q");
  ask(q.value);
  q.value = "";
});

say(DEMO.intro, "bot");
</script>
</body>
</html>
