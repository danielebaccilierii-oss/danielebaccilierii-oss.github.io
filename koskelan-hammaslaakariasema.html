<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>Koskelan Hammaslääkäriasema Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
  :root {
    --hue: 200;
    --bg: hsl(var(--hue) 25% 96%);
    --panel: #ffffff;
    --ink: hsl(var(--hue) 30% 12%);
    --muted: hsl(var(--hue) 12% 42%);
    --line: hsl(var(--hue) 18% 88%);
    --accent: hsl(var(--hue) 62% 38%);
    --accent-ink: #ffffff;
    --bot: hsl(var(--hue) 30% 94%);
    --flag-bg: #fff4d6;
    --flag-ink: #6b4a00;
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: hsl(var(--hue) 22% 9%);
      --panel: hsl(var(--hue) 20% 13%);
      --ink: hsl(var(--hue) 20% 92%);
      --muted: hsl(var(--hue) 10% 66%);
      --line: hsl(var(--hue) 15% 24%);
      --accent: hsl(var(--hue) 60% 62%);
      --accent-ink: hsl(var(--hue) 40% 10%);
      --bot: hsl(var(--hue) 18% 19%);
      --flag-bg: #3a2f10;
      --flag-ink: #ffd98a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: hsl(var(--hue) 22% 9%);
    --panel: hsl(var(--hue) 20% 13%);
    --ink: hsl(var(--hue) 20% 92%);
    --muted: hsl(var(--hue) 10% 66%);
    --line: hsl(var(--hue) 15% 24%);
    --accent: hsl(var(--hue) 60% 62%);
    --accent-ink: hsl(var(--hue) 40% 10%);
    --bot: hsl(var(--hue) 18% 19%);
    --flag-bg: #3a2f10;
    --flag-ink: #ffd98a;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: inherit; font-size: 15px; line-height: 1.5;
    padding-inline: 16px; padding-block: 16px; box-sizing: border-box;
    display: flex; justify-content: center;
  }
  .app {
    width: 100%; max-width: 440px; height: 100%; max-height: 760px;
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  }
  .flag {
    background: var(--flag-bg); color: var(--flag-ink);
    font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    padding: 8px 14px; text-align: center;
  }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; flex: none;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-weight: 700;
  }
  header h1 { font-size: 16px; margin: 0; text-wrap: balance; }
  header a { font-size: 13px; color: var(--muted); text-decoration: none; }
  header a:hover { text-decoration: underline; }
  .log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .me { background: var(--accent); color: var(--accent-ink); align-self: flex-end; border-bottom-right-radius: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; }
  .chips button {
    font: inherit; font-size: 13px; cursor: pointer;
    background: transparent; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 999px; padding: 5px 11px;
  }
  .chips button:hover { background: var(--bot); }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  input {
    flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
  }
  form button {
    font: inherit; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 0 16px;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note { font-size: 12px; color: var(--muted); text-align: center; padding: 0 16px 12px; margin: 0; }
</style>

</head>
<body>
<div class="app">
  <div class="flag">EXAMPLE · demo chatbot, not official</div>
  <header>
    <div class="avatar" id="avatar"></div>
    <div>
      <h1 id="name"></h1>
      <a id="site" target="_blank" rel="noopener"></a>
    </div>
  </header>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form id="form">
    <input id="q" autocomplete="off" placeholder="Type a question…" aria-label="Your question">
    <button type="submit">Send</button>
  </form>
  <p class="note">Keyword-based example built from public info on the company's website.</p>
</div>

<script>
const DEMO = {
 "name": "Koskelan Hammaslääkäriasema",
 "site": "https://www.koskelanhammas.fi",
 "hue": 185,
 "intro": "Hi! I'm the example assistant of Koskelan Hammaslääkäriasema, an independent full-service dental clinic at Käpyläntie 1, Helsinki. Ask me about opening hours, booking, prices or how to find us. (I can't give medical advice.)",
 "chips": [
  "What are your opening hours?",
  "How can I book an appointment?",
  "What services do you offer?",
  "How much does a check-up cost?",
  "Do you accept Kela?",
  "Where are you located?"
 ],
 "kb": [
  [
   [
    " pain",
    " ache",
    " hurt",
    " emergency",
    " urgent",
    " swollen",
    " swelling",
    " bleeding",
    " symptom"
   ],
   "I'm an example assistant and can't give medical advice. Please contact the clinic directly: call (09) 720 6800 or book online at https://www.aikasi.fi/koskela."
  ],
  [
   [
    " hour",
    " open",
    " close",
    " when are you"
   ],
   "Opening hours:\nMon 8:00–18:30\nTue 7:30–20:00\nWed 7:30–15:30\nThu 7:30–20:00\nFri 7:30–14:30"
  ],
  [
   [
    " cancel",
    " no show",
    " reschedul",
    " miss"
   ],
   "You can cancel an appointment by phone at (09) 720 6800. No-shows and same-day cancellations are charged according to the price list (e.g. €77 for an uncancelled 45-minute appointment). Please don't come to your appointment if you're ill."
  ],
  [
   [
    " kela",
    " reimburs",
    " compensat"
   ],
   "Yes, the price list shows the Kela reimbursement for each treatment. For example, a basic oral check-up costs €70.50, Kela reimburses €30, so you pay €40.50. Note: Kela normally reimburses the basic check-up only every other year. Full list: https://www.koskelanhammas.fi/hinnasto/"
  ],
  [
   [
    " pay",
    " card",
    " cash",
    " invoice",
    " office fee",
    " booking fee"
   ],
   "The clinic accepts cash and card payments only. There are no office fees, billing surcharges or booking fees."
  ],
  [
   [
    " price",
    " cost",
    " how much",
    " fee",
    " check",
    " exam",
    " filling",
    " crown",
    " denture"
   ],
   "Some prices (price list updated 1.1.2026):\n• Basic oral check-up €70.50 (Kela €30, you pay €40.50)\n• Fillings €85.50–€194\n• Gum disease treatment with a hygienist (60 min) €136\n• Tooth extraction €119–€316\n• Crown from €1,200, dentures from €950\nFull price list: https://www.koskelanhammas.fi/hinnasto/"
  ],
  [
   [
    " book",
    " appointment",
    " reserv",
    " time slot",
    " varaa"
   ],
   "You can book online at https://www.aikasi.fi/koskela or by phone at (09) 720 6800."
  ],
  [
   [
    " child",
    " kid",
    " pregnan",
    " anxious",
    " fear",
    " nervous",
    " scared",
    " afraid"
   ],
   "Yes, the clinic's services include children's dental care, dental care during pregnancy and care for anxious (fearful) patients. Book online at https://www.aikasi.fi/koskela or call (09) 720 6800."
  ],
  [
   [
    " service",
    " treatment",
    " offer",
    " do you do",
    " hygien",
    " clean",
    " gum",
    " x ray",
    " surgery",
    " implant",
    " prosthe"
   ],
   "Koskelan Hammas is a full-service dental clinic. Services include:\n• Basic dental care\n• Dental hygienist services\n• Gum disease treatment\n• X-ray examinations (digital)\n• Prosthetic treatment\n• Oral and maxillofacial surgery\n• Children's dental care\n• Dental care during pregnancy\n• Treatment of oral infections\n• Care for anxious patients"
  ],
  [
   [
    " where",
    " address",
    " locat",
    " find you",
    " direction"
   ],
   "We're at Käpyläntie 1, 00610 Helsinki, on the corner of Käpyläntie and Koskelantie. We mainly serve Käpylä, Kumpula, Koskela, Toukola, Oulunkylä, Arabia, Pasila, Viikki and Metsälä."
  ],
  [
   [
    " park",
    " car ",
    " bus",
    " tram",
    " transport",
    " bike",
    " access",
    " wheelchair"
   ],
   "There is a small parking area right in front of the clinic, accessible from Koskelantie, and drop-off is possible right at the entrance (good for people with reduced mobility). Buses 56, 57, 65, 69, 506 and 518 stop nearby, and the terminus of tram 1 is within walking distance. A seasonal city bike station is nearby too."
  ],
  [
   [
    " staff",
    " dentist",
    " doctor",
    " team",
    " who"
   ],
   "The team: dentists Katariina Savijoki, Sanni Aho and Katja Kurhela; dental hygienist Leila Leppänen; dental nurses Kristiina Kunnas and Marjo Ojalainen; and instrument care technician Senja Toikka."
  ],
  [
   [
    " chain",
    " independent",
    " history",
    " how long",
    " about"
   ],
   "Koskelan Hammaslääkäriasema is an independent dental clinic, not part of any chain, and has been operating for over 50 years."
  ],
  [
   [
    " contact",
    " email",
    " phone",
    " call",
    " number"
   ],
   "Phone: (09) 720 6800\nEmail: info@koskelanhammas.fi\nAddress: Käpyläntie 1, 00610 Helsinki"
  ],
  [
   [
    " hello",
    " hi ",
    " hey",
    " moi",
    " hei"
   ],
   "Hello! Ask me about opening hours, booking, prices, Kela or how to find us."
  ]
 ],
 "contact": "info@koskelanhammas.fi or (09) 720 6800"
};

document.documentElement.style.setProperty("--hue", DEMO.hue ?? 200);
document.getElementById("name").textContent = DEMO.name;
document.getElementById("avatar").textContent = (DEMO.name || "?").trim().charAt(0).toUpperCase();
const siteLink = document.getElementById("site");
siteLink.href = DEMO.site;
siteLink.textContent = DEMO.site.replace(/^https?:\/\//, "").replace(/\/$/, "");

const log = document.getElementById("log");
function say(text, who) {
  const el = document.createElement("div");
  el.className = "msg " + who;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

function answer(question) {
  const text = " " + question.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ") + " ";
  for (const [keys, reply] of DEMO.kb) {
    if (keys.some(k => text.includes(k.toLowerCase()))) return reply;
  }
  return "I don't have that answer in this example. You can contact the team directly: " + DEMO.contact;
}

function ask(question) {
  question = question.trim();
  if (!question) return;
  say(question, "me");
  setTimeout(() => say(answer(question), "bot"), 350);
}

const chips = document.getElementById("chips");
for (const c of DEMO.chips) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = c;
  b.addEventListener("click", () => ask(c));
  chips.appendChild(b);
}

document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const q = document.getElementById("q");
  ask(q.value);
  q.value = "";
});

say(DEMO.intro, "bot");
</script>
</body>
</html>
