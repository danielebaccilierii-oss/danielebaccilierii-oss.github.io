<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Eläinlääkäriasema Sun Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
  :root {
    --hue: 200;
    --bg: hsl(var(--hue) 25% 96%);
    --panel: #ffffff;
    --ink: hsl(var(--hue) 30% 12%);
    --muted: hsl(var(--hue) 12% 42%);
    --line: hsl(var(--hue) 18% 88%);
    --accent: hsl(var(--hue) 62% 38%);
    --accent-ink: #ffffff;
    --bot: hsl(var(--hue) 30% 94%);
    --flag-bg: #fff4d6;
    --flag-ink: #6b4a00;
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: hsl(var(--hue) 22% 9%);
      --panel: hsl(var(--hue) 20% 13%);
      --ink: hsl(var(--hue) 20% 92%);
      --muted: hsl(var(--hue) 10% 66%);
      --line: hsl(var(--hue) 15% 24%);
      --accent: hsl(var(--hue) 60% 62%);
      --accent-ink: hsl(var(--hue) 40% 10%);
      --bot: hsl(var(--hue) 18% 19%);
      --flag-bg: #3a2f10;
      --flag-ink: #ffd98a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: hsl(var(--hue) 22% 9%);
    --panel: hsl(var(--hue) 20% 13%);
    --ink: hsl(var(--hue) 20% 92%);
    --muted: hsl(var(--hue) 10% 66%);
    --line: hsl(var(--hue) 15% 24%);
    --accent: hsl(var(--hue) 60% 62%);
    --accent-ink: hsl(var(--hue) 40% 10%);
    --bot: hsl(var(--hue) 18% 19%);
    --flag-bg: #3a2f10;
    --flag-ink: #ffd98a;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: inherit; font-size: 15px; line-height: 1.5;
    padding-inline: 16px; padding-block: 16px; box-sizing: border-box;
    display: flex; justify-content: center;
  }
  .app {
    width: 100%; max-width: 440px; height: 100%; max-height: 760px;
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  }
  .flag {
    background: var(--flag-bg); color: var(--flag-ink);
    font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    padding: 8px 14px; text-align: center;
  }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; flex: none;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-weight: 700;
  }
  header h1 { font-size: 16px; margin: 0; text-wrap: balance; }
  header a { font-size: 13px; color: var(--muted); text-decoration: none; }
  header a:hover { text-decoration: underline; }
  .log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .me { background: var(--accent); color: var(--accent-ink); align-self: flex-end; border-bottom-right-radius: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; }
  .chips button {
    font: inherit; font-size: 13px; cursor: pointer;
    background: transparent; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 999px; padding: 5px 11px;
  }
  .chips button:hover { background: var(--bot); }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  input {
    flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
  }
  form button {
    font: inherit; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 0 16px;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note { font-size: 12px; color: var(--muted); text-align: center; padding: 0 16px 12px; margin: 0; }
</style>

<div class="app">
  <div class="flag">EXAMPLE · demo chatbot, not official</div>
  <header>
    <div class="avatar" id="avatar"></div>
    <div>
      <h1 id="name"></h1>
      <a id="site" target="_blank" rel="noopener"></a>
    </div>
  </header>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form id="form">
    <input id="q" autocomplete="off" placeholder="Type a question…" aria-label="Your question">
    <button type="submit">Send</button>
  </form>
  <p class="note">Keyword-based example built from public info on the company's website.</p>
</div>

<script>
const DEMO = {"name":"Eläinlääkäriasema Sun","site":"https://elainlaakariasemasun.fi/","hue":35,"intro":"Hi! I'm the example assistant for Eläinlääkäriasema Sun, an independent veterinary clinic in Talvikangas, Oulu. Ask me about opening hours, booking, vaccinations, prices or how to find us.","chips":["What are your opening hours?","How do I book an appointment?","Do you see urgent cases?","How much are vaccinations?","Where are you and is there parking?","Which payment methods do you accept?"],"kb":[[[" urgent"," emergency"," acute"," sick"," injured"," same day"," today"],"We reserve appointment slots every day for acute patients, so your pet can get care as quickly and easily as possible. Book these by calling 050 477 8080, or check the online booking, where same-day free slots are shown: https://nettiaika.dyndns.org/nettiaika/klinikka/SunOy"],[[" vaccin"," rabies"," kennel cough"," booster"," puppy"," kitten"],"Dogs are vaccinated against distemper, infectious hepatitis, parvovirus and rabies, and often kennel cough. Cats are vaccinated against feline panleukopenia and cat flu, and rabies is recommended for outdoor cats.\n\nWednesday is our vaccination day: 1 vaccine 51.50 €, 2 vaccines 57.50 € (dog or cat).\nRegular prices: dog 4-in-1 66 €, dog 4-in-1 + rabies 72 €, rabies (dog or cat) 66 €, kennel cough 66–78 €, cat triple vaccine 66 €, cat triple + rabies 72 €.\n\nBook online or by phone on 050 477 8080."],[[" castrat"," neuter"," steril"," spay"],"Castration: cat 116 €, dog under 25 kg 305–330 €, dog 25–50 kg 335–380 €, dog over 50 kg from 455 €.\nSterilization: cat 195 €, dog under 25 kg 445–500 €, dog 25–50 kg 530–570 €, dog over 50 kg from 630 €."],[[" dental"," teeth"," tooth"," mouth"],"We offer oral and dental care. Prices: cat 280–330 €, dog under 25 kg 335–350 €, dog 25–50 kg 350–400 €, dog over 50 kg 400–500 €."],[[" euthanas"," put down"," put to sleep"," end of life"],"We offer euthanasia for pets. Prices: cat 125–135 €, dog under 50 kg 132–150 €, dog over 50 kg 150–190 €. Please call us on 050 477 8080 and we will help you."],[[" cancel"," reschedul"," no show"],"Please cancel at least 24 hours before your appointment by phone, text message or WhatsApp. Appointments not cancelled are charged: 50 € for 15–60 min bookings and 115 € for 60–120 min bookings."],[[" pay"," card"," cash"," insurance"," installment"," instalment"],"You can pay by cash and the most common debit and credit cards. We offer LähiTapiola direct billing (weekdays 9.00–17.00) and Agria direct billing (weekdays 9.00–16.30). You can also pay later, with up to 12 months interest-free."],[[" price"," cost"," how much"," fee"," visit"],"A basic visit is 78 € (15 min) or 110 € (30 min). The full price list is at https://elainlaakariasemasun.fi/hinnasto/"],[[" book"," appointment"," reserv"],"You can book online at https://nettiaika.dyndns.org/nettiaika/klinikka/SunOy or call 050 477 8080."],[[" open"," hours"," when"," monday"," tuesday"," wednesday"," thursday"," friday"],"Opening hours:\nMon 8.00–16.00\nTue–Wed 12.00–20.00\nThu 8.00–17.00\nFri 8.00–16.00"],[[" park"," where"," address"," location"," bus"," find you"," directions"],"We're at Tuiskutie 3, 90630 Oulu, in the Talvikangas district, just a minute's drive from Kuusamontie (road 20) at the Rusko/Talvikangas junction. There's plenty of free parking in our yard. Buses 9 and 10 run from Oulu city centre, and the bus stop is 100 m from us."],[[" service"," treat"," surgery"," x ray"," xray"," ultrasound"," lab"," kennel club"," pain"," limp"],"Our services include pet healthcare, vaccinations, oral and dental care, musculoskeletal problems, pain management, soft tissue surgery, castration and sterilization, laboratory tests and internal medicine, X-ray and ultrasound, acute care, official Kennel Club examinations and euthanasia."],[[" phone"," call"," email"," contact"],"Phone: 050 477 8080\nEmail: info@elainlaakariasemasun.fi"]],"contact":"info@elainlaakariasemasun.fi"};

document.documentElement.style.setProperty("--hue", DEMO.hue ?? 200);
document.getElementById("name").textContent = DEMO.name;
document.getElementById("avatar").textContent = (DEMO.name || "?").trim().charAt(0).toUpperCase();
const siteLink = document.getElementById("site");
siteLink.href = DEMO.site;
siteLink.textContent = DEMO.site.replace(/^https?:\/\//, "").replace(/\/$/, "");

const log = document.getElementById("log");
function say(text, who) {
  const el = document.createElement("div");
  el.className = "msg " + who;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

function answer(question) {
  const text = " " + question.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ") + " ";
  for (const [keys, reply] of DEMO.kb) {
    if (keys.some(k => text.includes(k.toLowerCase()))) return reply;
  }
  return "I don't have that answer in this example. You can contact the team directly: " + DEMO.contact;
}

function ask(question) {
  question = question.trim();
  if (!question) return;
  say(question, "me");
  setTimeout(() => say(answer(question), "bot"), 350);
}

const chips = document.getElementById("chips");
for (const c of DEMO.chips) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = c;
  b.addEventListener("click", () => ask(c));
  chips.appendChild(b);
}

document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const q = document.getElementById("q");
  ask(q.value);
  q.value = "";
});

say(DEMO.intro, "bot");
</script>

</body>
</html>
