<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>Fysiokeskus Itäkunto Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
  :root {
    --hue: 200;
    --bg: hsl(var(--hue) 25% 96%);
    --panel: #ffffff;
    --ink: hsl(var(--hue) 30% 12%);
    --muted: hsl(var(--hue) 12% 42%);
    --line: hsl(var(--hue) 18% 88%);
    --accent: hsl(var(--hue) 62% 38%);
    --accent-ink: #ffffff;
    --bot: hsl(var(--hue) 30% 94%);
    --flag-bg: #fff4d6;
    --flag-ink: #6b4a00;
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: hsl(var(--hue) 22% 9%);
      --panel: hsl(var(--hue) 20% 13%);
      --ink: hsl(var(--hue) 20% 92%);
      --muted: hsl(var(--hue) 10% 66%);
      --line: hsl(var(--hue) 15% 24%);
      --accent: hsl(var(--hue) 60% 62%);
      --accent-ink: hsl(var(--hue) 40% 10%);
      --bot: hsl(var(--hue) 18% 19%);
      --flag-bg: #3a2f10;
      --flag-ink: #ffd98a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: hsl(var(--hue) 22% 9%);
    --panel: hsl(var(--hue) 20% 13%);
    --ink: hsl(var(--hue) 20% 92%);
    --muted: hsl(var(--hue) 10% 66%);
    --line: hsl(var(--hue) 15% 24%);
    --accent: hsl(var(--hue) 60% 62%);
    --accent-ink: hsl(var(--hue) 40% 10%);
    --bot: hsl(var(--hue) 18% 19%);
    --flag-bg: #3a2f10;
    --flag-ink: #ffd98a;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: inherit; font-size: 15px; line-height: 1.5;
    padding-inline: 16px; padding-block: 16px; box-sizing: border-box;
    display: flex; justify-content: center;
  }
  .app {
    width: 100%; max-width: 440px; height: 100%; max-height: 760px;
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  }
  .flag {
    background: var(--flag-bg); color: var(--flag-ink);
    font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    padding: 8px 14px; text-align: center;
  }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; flex: none;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-weight: 700;
  }
  header h1 { font-size: 16px; margin: 0; text-wrap: balance; }
  header a { font-size: 13px; color: var(--muted); text-decoration: none; }
  header a:hover { text-decoration: underline; }
  .log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .me { background: var(--accent); color: var(--accent-ink); align-self: flex-end; border-bottom-right-radius: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; }
  .chips button {
    font: inherit; font-size: 13px; cursor: pointer;
    background: transparent; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 999px; padding: 5px 11px;
  }
  .chips button:hover { background: var(--bot); }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  input {
    flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
  }
  form button {
    font: inherit; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 0 16px;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note { font-size: 12px; color: var(--muted); text-align: center; padding: 0 16px 12px; margin: 0; }
</style>

</head>
<body>
<div class="app">
  <div class="flag">EXAMPLE · demo chatbot, not official</div>
  <header>
    <div class="avatar" id="avatar"></div>
    <div>
      <h1 id="name"></h1>
      <a id="site" target="_blank" rel="noopener"></a>
    </div>
  </header>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form id="form">
    <input id="q" autocomplete="off" placeholder="Type a question…" aria-label="Your question">
    <button type="submit">Send</button>
  </form>
  <p class="note">Keyword-based example built from public info on the company's website.</p>
</div>

<script>
const DEMO = {"name":"Fysiokeskus Itäkunto","site":"https://www.itakunto.fi","hue":195,"intro":"Hi! I'm the Fysiokeskus Itäkunto assistant. Ask me about our services, prices, opening hours, Kela reimbursement or how to book.","chips":["What are your opening hours?","How do I book?","Where are you located?","How much is a massage?","Does Kela reimburse physiotherapy?","Do you do home visits?"],"kb":[[[" hour"," open"," opening"," close"," closing"," when"],"We are open Monday to Thursday 8:00-20:00 and Friday 8:00-16:00."],[[" book"," booking"," appointment"," reserve"," reservation"],"You can book online through our NordHealth booking page: https://www.nordhealth.fi/fi/yritys/fysiokeskus-itakunto?tab=appointments\nPhone bookings: Mon-Fri 8:00-16:00, tel. 09 343 4240."],[[" where"," address"," location"," located"," find you"," itis"," directions"],"We are at Itäkatu 7, 2nd floor, 00930 Helsinki, in Shopping Centre Itis. Enter from the shopping centre side at Hansasilta and go up to the second floor."],[[" kela"," reimburs"," referral"],"Kela reimburses physiotherapy without a doctor's referral: 4 visits per calendar year, 15 € per visit. We also accept Helsinki city service vouchers, HUS agreements and insurance company clients."],[[" voucher"," insurance"," hus"," smartum"," edenred"," payment"," pay "],"We accept Helsinki city service vouchers, HUS agreements and insurance company clients, and the price list mentions Smartum and Edenred. Self-paid treatment is of course also possible."],[[" home visit"," home"," visit you"],"Yes, we also do home visits. Please contact us for details: fysiokeskus@itakunto.fi or 09 343 4240."],[[" student"," retire"," pension"," discount"," senior"],"Students and retirees get 10% off massage prices."],[[" hot stone"," stone"],"Hot stone massage: 60 min 78 €, 90 min 108 €."],[[" head massage"," indian"],"Indian head massage: 30 min 45 €, 45 min 65 €."],[[" cupping"],"Cupping massage: 30 min 45 €, 45 min 65 €, 60 min 70 €."],[[" massage"," hieronta"],"Massage prices: 30 min 42 €, 45 min 62 €, 60 min 68 €, 90 min 98 €. A 10-visit massage card is also available (standard rates). Students and retirees get 10% off massage prices."],[[" acupuncture"],"Acupuncture, 60 min: 87 €."],[[" osteopath"],"Osteopathic treatment: 85 €. Our team includes osteopaths, physiotherapists and massage therapists."],[[" pregnan"," maternity"," postnatal"],"We offer maternity physiotherapy (first visit 90 min, 115 €) and pregnancy massage."],[[" gym"," training"," workout"],"Gym: single visit 6 €, 1 month 59 €, 3 months 128 €, 6 months 215 € (memberships include gym instruction)."],[[" insole"," footbalance"," shoe"],"We offer Footbalance custom shoe insoles on site."],[[" price"," cost"," how much"," fee"],"Physical therapy: 30 min 62 €, 45 min 75 €, 60 min 85 €. Massage: 30 min 42 €, 60 min 68 €. Osteopathic treatment 85 €, acupuncture 60 min 87 €. Ask me about a specific service for more prices."],[[" physio"," rehab"," neurolog"," psychophysical"," psychosomatic"," pain"],"We offer physiotherapy, neurological physiotherapy, psychophysical physiotherapy and maternity physiotherapy. Physical therapy prices: 30 min 62 €, 45 min 75 €, 60 min 85 €. Kela reimburses 4 visits per year without a referral."],[[" company"," corporate"," employer"," business"],"We also offer corporate visits. Please contact us for details: fysiokeskus@itakunto.fi."],[[" service"," treatment"," offer"," what do you do"],"Our services: osteopathy, physiotherapy, neurological, psychophysical and maternity physiotherapy, massage, pregnancy massage, acupuncture, fascia treatment, cupping massage, Indian head massage, kinesio taping, hot stone massage, shoe insoles, gym and corporate visits."],[[" taping"," kinesio"," fascia"],"We offer kinesio taping and fascia treatment. Please contact us for pricing: 09 343 4240."],[[" contact"," phone"," email"," call"],"Phone: 09 343 4240 (bookings Mon-Fri 8:00-16:00)\nEmail: fysiokeskus@itakunto.fi"],[[" hello"," hi "," hey"," moi"," hei"],"Hello! How can I help you? You can ask about services, prices, Kela reimbursement, opening hours or booking."]],"contact":"fysiokeskus@itakunto.fi or 09 343 4240"};

document.documentElement.style.setProperty("--hue", DEMO.hue ?? 200);
document.getElementById("name").textContent = DEMO.name;
document.getElementById("avatar").textContent = (DEMO.name || "?").trim().charAt(0).toUpperCase();
const siteLink = document.getElementById("site");
siteLink.href = DEMO.site;
siteLink.textContent = DEMO.site.replace(/^https?:\/\//, "").replace(/\/$/, "");

const log = document.getElementById("log");
function say(text, who) {
  const el = document.createElement("div");
  el.className = "msg " + who;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

function answer(question) {
  const text = " " + question.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ") + " ";
  for (const [keys, reply] of DEMO.kb) {
    if (keys.some(k => text.includes(k.toLowerCase()))) return reply;
  }
  return "I don't have that answer in this example. You can contact the team directly: " + DEMO.contact;
}

function ask(question) {
  question = question.trim();
  if (!question) return;
  say(question, "me");
  setTimeout(() => say(answer(question), "bot"), 350);
}

const chips = document.getElementById("chips");
for (const c of DEMO.chips) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = c;
  b.addEventListener("click", () => ask(c));
  chips.appendChild(b);
}

document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const q = document.getElementById("q");
  ask(q.value);
  q.value = "";
});

say(DEMO.intro, "bot");
</script>
</body>
</html>
