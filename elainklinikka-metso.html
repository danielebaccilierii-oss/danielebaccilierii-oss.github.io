<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Eläinklinikka Metso Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
  :root {
    --hue: 200;
    --bg: hsl(var(--hue) 25% 96%);
    --panel: #ffffff;
    --ink: hsl(var(--hue) 30% 12%);
    --muted: hsl(var(--hue) 12% 42%);
    --line: hsl(var(--hue) 18% 88%);
    --accent: hsl(var(--hue) 62% 38%);
    --accent-ink: #ffffff;
    --bot: hsl(var(--hue) 30% 94%);
    --flag-bg: #fff4d6;
    --flag-ink: #6b4a00;
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: hsl(var(--hue) 22% 9%);
      --panel: hsl(var(--hue) 20% 13%);
      --ink: hsl(var(--hue) 20% 92%);
      --muted: hsl(var(--hue) 10% 66%);
      --line: hsl(var(--hue) 15% 24%);
      --accent: hsl(var(--hue) 60% 62%);
      --accent-ink: hsl(var(--hue) 40% 10%);
      --bot: hsl(var(--hue) 18% 19%);
      --flag-bg: #3a2f10;
      --flag-ink: #ffd98a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: hsl(var(--hue) 22% 9%);
    --panel: hsl(var(--hue) 20% 13%);
    --ink: hsl(var(--hue) 20% 92%);
    --muted: hsl(var(--hue) 10% 66%);
    --line: hsl(var(--hue) 15% 24%);
    --accent: hsl(var(--hue) 60% 62%);
    --accent-ink: hsl(var(--hue) 40% 10%);
    --bot: hsl(var(--hue) 18% 19%);
    --flag-bg: #3a2f10;
    --flag-ink: #ffd98a;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: inherit; font-size: 15px; line-height: 1.5;
    padding-inline: 16px; padding-block: 16px; box-sizing: border-box;
    display: flex; justify-content: center;
  }
  .app {
    width: 100%; max-width: 440px; height: 100%; max-height: 760px;
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  }
  .flag {
    background: var(--flag-bg); color: var(--flag-ink);
    font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    padding: 8px 14px; text-align: center;
  }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; flex: none;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-weight: 700;
  }
  header h1 { font-size: 16px; margin: 0; text-wrap: balance; }
  header a { font-size: 13px; color: var(--muted); text-decoration: none; }
  header a:hover { text-decoration: underline; }
  .log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .me { background: var(--accent); color: var(--accent-ink); align-self: flex-end; border-bottom-right-radius: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; }
  .chips button {
    font: inherit; font-size: 13px; cursor: pointer;
    background: transparent; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 999px; padding: 5px 11px;
  }
  .chips button:hover { background: var(--bot); }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  input {
    flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
  }
  form button {
    font: inherit; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 0 16px;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note { font-size: 12px; color: var(--muted); text-align: center; padding: 0 16px 12px; margin: 0; }
</style>

<div class="app">
  <div class="flag">EXAMPLE · demo chatbot, not official</div>
  <header>
    <div class="avatar" id="avatar"></div>
    <div>
      <h1 id="name"></h1>
      <a id="site" target="_blank" rel="noopener"></a>
    </div>
  </header>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form id="form">
    <input id="q" autocomplete="off" placeholder="Type a question…" aria-label="Your question">
    <button type="submit">Send</button>
  </form>
  <p class="note">Keyword-based example built from public info on the company's website.</p>
</div>

<script>
const DEMO = {"name":"Eläinklinikka Metso","site":"https://www.elainklinikkametso.fi/","hue":150,"intro":"Hi! I'm the Eläinklinikka Metso example assistant. Ask me about opening hours, booking, prices, services, payment or how to find the clinic in Taulumäki, Jyväskylä.","chips":["What are your opening hours?","How do I book an appointment?","How much does a visit cost?","Which payment methods do you accept?","What services do you offer?","Where are you and is there parking?"],"kb":[[[" hour"," open"," close"," closed"," when"," time"],"We are open Monday to Thursday 7:00–16:00 and Friday 7:00–14:00."],[[" book"," booking"," appointment"," reserve"," reservation"],"You can book an appointment online through the booking link (AJANVARAUS) on our website, or call us on 010 739 9100."],[[" cancel"," cancellation"," reschedule"],"If you can't make it, please cancel your appointment at least 24 hours before the booked time."],[[" pay"," payment"," card"," cash"," agria"," resurs"," insurance"," financ"],"We accept card payment, or financing with the Eläinlääkäritili veterinary account offered by Resurs Bank. We also offer Agria's direct reimbursement service. Please note that we do not accept cash."],[[" vaccin"," rabies"],"Example vaccination prices: cat 3-vaccine 71.50 €, dog 4-vaccine 69 €, rabies vaccine 65 €. Our prices include the 29 € clinic fee and VAT."],[[" castrat"," neuter"," spay"," steril"],"Example prices: cat castration 112 €, dog castration (under 35 kg) 357 €, laparoscopic spay 730 €. Prices include the 29 € clinic fee and VAT. See the full price list on our website."],[[" price"," prices"," cost"," how much"," fee"," visit"],"Example visit prices: brief visit (about 15 min) 71.50 €, basic visit (about 30 min) 122 €, extended visit (about 60 min) 201 €. Our prices include the 29 € clinic fee and VAT. In emergency cases there is a 25% emergency surcharge. The full price list is on our website."],[[" emergenc"," urgent"],"In emergency cases there is a 25% emergency surcharge. Our opening hours are Monday–Thursday 7–16 and Friday 7–14, and our phone number is 010 739 9100."],[[" surgery"," surgical"," operation"],"We perform many surgical procedures, including gallbladder removal, laparoscopic sterilisation, cryptorchid surgery, pyometra treatment, caesarean sections, bladder stone removal, foreign body removal, tumour surgery and toe or tail amputation."],[[" dental"," teeth"," tooth"," tartar"],"Our dental care for dogs and cats includes tartar removal, tooth examination, surgical extractions and full-mouth dental X-rays."],[[" skin"," ear "," ears"," itch"],"Skin problems are very common in pets. We treat skin and ear conditions with a thorough examination and a treatment plan tailored to your pet."],[[" endoscop"," scope"],"We offer video-assisted endoscopy: stomach and intestine, colon, urinary tract, nose, ear and abdominal endoscopy, for both diagnosis and treatment."],[[" x ray"," xray"," ultrasound"," imaging"," scan"],"We have digital X-ray and abdominal ultrasound. Example prices: X-rays (1–2 images) 107 €, basic ultrasound 107 €."],[[" lab "," laborator"," blood"," urine"," test"],"We offer laboratory tests such as blood tests, skin samples, urine tests and sensitivity testing. Some results are available during the same visit."],[[" certificate"," pevisa"," kennel"],"We do official health examinations for the Finnish Kennel Club's PEVISA programme. A veterinary certificate costs 50 €."],[[" euthan"," put down"," put to sleep"," cremat"],"We offer euthanasia services, and we work together with a cremation partner."],[[" service"," services"," treat"," offer"],"Our services include skin and ear care, surgery, endoscopy, laboratory tests, dentistry, digital X-ray and ultrasound, official health examinations (PEVISA), special pet foods, and euthanasia with a cremation partner."],[[" where"," address"," location"," find"," park"," parking"," bus"],"We are at Taulumäentie 15, 40200 Jyväskylä. There are free parking spaces in front of the building, and a bus stop right next to the clinic."],[[" staff"," team"," vet "," veterinarian"," who "],"We are an independent clinic, not part of any chain. The clinic is run by nurses Henna and Noora and veterinarian Viivi."],[[" contact"," phone"," call"," email"],"Call us on 010 739 9100 or email info@elainklinikkametso.fi. Address: Taulumäentie 15, 40200 Jyväskylä."]],"contact":"info@elainklinikkametso.fi"};

document.documentElement.style.setProperty("--hue", DEMO.hue ?? 200);
document.getElementById("name").textContent = DEMO.name;
document.getElementById("avatar").textContent = (DEMO.name || "?").trim().charAt(0).toUpperCase();
const siteLink = document.getElementById("site");
siteLink.href = DEMO.site;
siteLink.textContent = DEMO.site.replace(/^https?:\/\//, "").replace(/\/$/, "");

const log = document.getElementById("log");
function say(text, who) {
  const el = document.createElement("div");
  el.className = "msg " + who;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

function answer(question) {
  const text = " " + question.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ") + " ";
  for (const [keys, reply] of DEMO.kb) {
    if (keys.some(k => text.includes(k.toLowerCase()))) return reply;
  }
  return "I don't have that answer in this example. You can contact the team directly: " + DEMO.contact;
}

function ask(question) {
  question = question.trim();
  if (!question) return;
  say(question, "me");
  setTimeout(() => say(answer(question), "bot"), 350);
}

const chips = document.getElementById("chips");
for (const c of DEMO.chips) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = c;
  b.addEventListener("click", () => ask(c));
  chips.appendChild(b);
}

document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const q = document.getElementById("q");
  ask(q.value);
  q.value = "";
});

say(DEMO.intro, "bot");
</script>

</body>
</html>
