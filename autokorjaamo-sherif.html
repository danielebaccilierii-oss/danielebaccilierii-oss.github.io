<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Autokorjaamo Sherif Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
  :root {
    --hue: 200;
    --bg: hsl(var(--hue) 25% 96%);
    --panel: #ffffff;
    --ink: hsl(var(--hue) 30% 12%);
    --muted: hsl(var(--hue) 12% 42%);
    --line: hsl(var(--hue) 18% 88%);
    --accent: hsl(var(--hue) 62% 38%);
    --accent-ink: #ffffff;
    --bot: hsl(var(--hue) 30% 94%);
    --flag-bg: #fff4d6;
    --flag-ink: #6b4a00;
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: hsl(var(--hue) 22% 9%);
      --panel: hsl(var(--hue) 20% 13%);
      --ink: hsl(var(--hue) 20% 92%);
      --muted: hsl(var(--hue) 10% 66%);
      --line: hsl(var(--hue) 15% 24%);
      --accent: hsl(var(--hue) 60% 62%);
      --accent-ink: hsl(var(--hue) 40% 10%);
      --bot: hsl(var(--hue) 18% 19%);
      --flag-bg: #3a2f10;
      --flag-ink: #ffd98a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: hsl(var(--hue) 22% 9%);
    --panel: hsl(var(--hue) 20% 13%);
    --ink: hsl(var(--hue) 20% 92%);
    --muted: hsl(var(--hue) 10% 66%);
    --line: hsl(var(--hue) 15% 24%);
    --accent: hsl(var(--hue) 60% 62%);
    --accent-ink: hsl(var(--hue) 40% 10%);
    --bot: hsl(var(--hue) 18% 19%);
    --flag-bg: #3a2f10;
    --flag-ink: #ffd98a;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: inherit; font-size: 15px; line-height: 1.5;
    padding-inline: 16px; padding-block: 16px; box-sizing: border-box;
    display: flex; justify-content: center;
  }
  .app {
    width: 100%; max-width: 440px; height: 100%; max-height: 760px;
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  }
  .flag {
    background: var(--flag-bg); color: var(--flag-ink);
    font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    padding: 8px 14px; text-align: center;
  }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; flex: none;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-weight: 700;
  }
  header h1 { font-size: 16px; margin: 0; text-wrap: balance; }
  header a { font-size: 13px; color: var(--muted); text-decoration: none; }
  header a:hover { text-decoration: underline; }
  .log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .me { background: var(--accent); color: var(--accent-ink); align-self: flex-end; border-bottom-right-radius: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; }
  .chips button {
    font: inherit; font-size: 13px; cursor: pointer;
    background: transparent; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 999px; padding: 5px 11px;
  }
  .chips button:hover { background: var(--bot); }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  input {
    flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
  }
  form button {
    font: inherit; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 0 16px;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note { font-size: 12px; color: var(--muted); text-align: center; padding: 0 16px 12px; margin: 0; }
</style>

<div class="app">
  <div class="flag">EXAMPLE · demo chatbot, not official</div>
  <header>
    <div class="avatar" id="avatar"></div>
    <div>
      <h1 id="name"></h1>
      <a id="site" target="_blank" rel="noopener"></a>
    </div>
  </header>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form id="form">
    <input id="q" autocomplete="off" placeholder="Type a question…" aria-label="Your question">
    <button type="submit">Send</button>
  </form>
  <p class="note">Keyword-based example built from public info on the company's website.</p>
</div>

<script>
const DEMO = {"name":"Autokorjaamo Sherif","site":"https://sherifcars.fi/","hue":210,"intro":"Hi! I'm the assistant of Autokorjaamo Sherif, a car repair shop in Turku with over 17 years of experience. Ask me about our services, prices, opening hours or how to reach us.","chips":["What are your opening hours?","What services do you offer?","How much is AC service?","Tyre change prices?","Do you have a replacement car?","How do I book?"],"kb":[[[" hour"," open"," close"," saturday"," weekend"],"We are open Monday to Friday 8:00-17:00 and Saturday 10:00-14:00."],[[" where"," address"," location"," located"," kalevantie"," directions"],"You can find us at Kalevantie 25, 20520 Turku."],[[" replacement car"," substitute"," courtesy"," loan car"," spare car"],"Yes, we offer a replacement car service so you can stay mobile while your car is with us. Contact us to arrange it: 0400 775 576 or info@autokorjaamosherif.fi."],[[" ac "," a c "," aircon"," air con"," air-con"," climate"," refrigerant"," ozone"," cabin filter"],"Air conditioning service prices:\n- Cars 2015 and older (R134 gas): €39 + €0.10/g (average service about €69)\n- Cars 2016 and newer (R1234yf gas): €39 + €0.30/g (average service about €99)\n- Hybrid/electric cars with POE oil: €10\n- Leak detection with UV light and nitrogen: €70\n- Cabin air filter change: €15-35 + filter €10-35\n- Interior ozone treatment: €50"],[[" tyre"," tire"," wheel change"," balanc"," puncture"," kumho"," fortune"," storage"],"Tyre services:\n- Tyre change / fitting: €25-40 depending on vehicle\n- Tyre work and balancing per set: 13-16\" €50, 17-18\" €60-70, 19\" €80, 20\" €100\n- Balancing only: 13-16\" €25, 17\" and up €30-40\n- Tyre repair / puncture patch: €30-35\n- Valve change: €15-35\n- Seasonal tyre storage: €50-70\nWe also sell tyres, for example Kumho and Fortune."],[[" alignment"," align"," steering"," wheel angle"],"Wheel alignment check and adjustment: €79 for cars, city SUVs, SUVs and vans, €89 for large vans."],[[" diagnos"," electric"," fault"," warning light"," check engine"," obd"],"We do car electrical work and diagnostics. A system diagnosis with a test device costs €35. Demanding electrical work and system diagnostics are €89/h."],[[" inspection"," katsastus"," emission"],"We do inspection repairs (katsastuskorjaus) to get your car ready for the vehicle inspection. Emission measurement + OBD for petrol cars (2001 and newer): €25."],[[" wash"," clean"," wax"," polish"," detailing"," dog hair"," leather"," headlight"],"Our washes and interior cleaning are done carefully by hand. Examples:\n- Exterior wash: €25-40\n- Interior cleaning: €54\n- Light interior clean with exterior wash: €20-30\n- Seat wet wash: €80 / €100 (7 seats)\n- Leather cleaning and care: from €35\n- Dog hair removal: from €50\n- Paint polishing: €100-150 per layer\n- Engine wash from above: €50\n- Headlight restoration: €79 per pair"],[[" paint"," body"," dent"," scratch"," rust"],"Yes, we do car painting and bodywork. Contact us for a quote: 0400 775 576 or info@autokorjaamosherif.fi."],[[" services"," what do you do"," offer"],"We offer:\n- General car repair\n- Inspection repairs\n- Scheduled maintenance\n- Electrical work and diagnostics\n- Air conditioning service and repair\n- Tyre sales and fitting\n- Wheel alignment\n- Car painting and bodywork\n- Car wash and interior cleaning\nWe also offer a replacement car service."],[[" maintenance"," service"," servicing"," repair"," mechanic"],"We do general car repairs and scheduled maintenance. Our workshop hourly rate is €79/h. For an estimate, contact us at 0400 775 576 or info@autokorjaamosherif.fi."],[[" price"," prices"," cost"," how much"," hourly"," rate"," labour"," labor"],"Our workshop hourly rate is €79/h, and demanding electrical work and diagnostics are €89/h. Ask me about a specific service (AC, tyres, alignment, washing) for its price."],[[" book"," appointment"," reserve"," contact"," phone"," call"," email"," quote"],"You can reach us by phone at 0400 775 576, by email at info@autokorjaamosherif.fi, or through the service inquiry form on our website. Or visit us at Kalevantie 25, Turku."],[[" experience"," years"," about"," who are"],"Autokorjaamo Sherif is a car repair shop in Turku with over 17 years of experience."],[[" hi "," hello"," hey"," moi"," hei"],"Hello! How can I help you? You can ask about our services, prices, opening hours or location."]],"contact":"0400 775 576 / info@autokorjaamosherif.fi"};

document.documentElement.style.setProperty("--hue", DEMO.hue ?? 200);
document.getElementById("name").textContent = DEMO.name;
document.getElementById("avatar").textContent = (DEMO.name || "?").trim().charAt(0).toUpperCase();
const siteLink = document.getElementById("site");
siteLink.href = DEMO.site;
siteLink.textContent = DEMO.site.replace(/^https?:\/\//, "").replace(/\/$/, "");

const log = document.getElementById("log");
function say(text, who) {
  const el = document.createElement("div");
  el.className = "msg " + who;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

function answer(question) {
  const text = " " + question.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ") + " ";
  for (const [keys, reply] of DEMO.kb) {
    if (keys.some(k => text.includes(k.toLowerCase()))) return reply;
  }
  return "I don't have that answer in this example. You can contact the team directly: " + DEMO.contact;
}

function ask(question) {
  question = question.trim();
  if (!question) return;
  say(question, "me");
  setTimeout(() => say(answer(question), "bot"), 350);
}

const chips = document.getElementById("chips");
for (const c of DEMO.chips) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = c;
  b.addEventListener("click", () => ask(c));
  chips.appendChild(b);
}

document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const q = document.getElementById("q");
  ask(q.value);
  q.value = "";
});

say(DEMO.intro, "bot");
</script>

</body>
</html>
